      dg.addColorStop(1, 'rgba(255,93,77,0)');
      g.fillStyle = dg;
      g.fillRect(-sx, -sy, sx * 2, sy * 2);
    }
    if (e.type === 'swift') {
      g.strokeStyle = rgba(body, 0.45);
      g.lineWidth = u * 0.035;
      for (let k = -1; k <= 1; k++) {
        const ox = k * sx * 0.22;
        g.beginPath();
        g.moveTo(ox, -sy * 0.3);
        g.lineTo(ox + Math.sin(t * 5 + k) * u * 0.02, -sy * 0.62 - (k === 0 ? u * 0.08 : 0));
        g.stroke();
      }
    }

    g.shadowColor = rgba(body, 0.55);
    g.shadowBlur = u * 0.22;
    const grad = g.createRadialGradient(-sx * 0.12, -sy * 0.18, sx * 0.05, 0, 0, Math.max(sx, sy) * 0.55);
    grad.addColorStop(0, '#ffffff');
    grad.addColorStop(0.35, body);
    grad.addColorStop(1, shade);
    g.fillStyle = grad;
    g.beginPath();
    const puffs = wide > 1 ? PUFFS.concat([[-0.5, 0.05, 0.2], [0.5, 0.05, 0.2], [-0.42, -0.14, 0.16], [0.42, -0.14, 0.16]]) : PUFFS;
    puffs.forEach((p, k) => {
      const wob = Math.sin(t * 2.1 + k * 1.3 + seed) * 0.018;
      const px = p[0] * sx * (wide > 1 ? 1.9 : 1), py = p[1] * sy;
      g.moveTo(px + (p[2] + wob) * sx, py);
      g.arc(px, py, (p[2] + wob) * Math.min(sx, sy) * (wide > 1 ? 1.25 : 1.05), 0, Math.PI * 2);
    });
    g.fill();
    g.shadowBlur = 0;

    if (e.type === 'shell') {
      g.fillStyle = kind.plate;
      g.strokeStyle = 'rgba(30,24,36,0.5)';
      g.lineWidth = u * 0.02;
      const plates = [[-0.2, -0.12, 0.16], [0.18, -0.14, 0.15], [0.02, 0.2, 0.17]];
      for (const p of plates) {
        g.beginPath();
        for (let k = 0; k < 5; k++) {
          const a = k * 1.2566 + p[0] * 3;
          const rr = p[2] * sx * (0.8 + 0.25 * ((k * 7) % 3) / 2);
          g[k ? 'lineTo' : 'moveTo'](p[0] * sx + Math.cos(a) * rr, p[1] * sy + Math.sin(a) * rr);
        }
        g.closePath();
        g.fill();
        g.stroke();
      }
    }
    if (e.type === 'split') {
      g.strokeStyle = rgba(shade, 0.9);
      g.lineWidth = u * 0.03;
      g.beginPath();
      g.moveTo(0, -sy * 0.38);
      g.lineTo(-sx * 0.04, -sy * 0.1);
      g.lineTo(sx * 0.05, sy * 0.08);
      g.lineTo(0, sy * 0.34);
      g.stroke();
    }
    if (e.type === 'king') {
      g.fillStyle = rgba('#e9e4ff', 0.9);
      for (let k = -2; k <= 2; k++) {
        g.beginPath();
        g.moveTo(k * sx * 0.12 - sx * 0.05, -sy * 0.3);
        g.lineTo(k * sx * 0.12, -sy * 0.52 - (k === 0 ? sy * 0.1 : Math.abs(k) === 1 ? sy * 0.05 : 0));
        g.lineTo(k * sx * 0.12 + sx * 0.05, -sy * 0.3);
        g.fill();
      }
      const cg = g.createRadialGradient(0, sy * 0.05, 0, 0, sy * 0.05, sx * 0.2);
      cg.addColorStop(0, 'rgba(255,255,255,1)');
      cg.addColorStop(0.4, 'rgba(210,190,255,0.9)');
      cg.addColorStop(1, 'rgba(160,140,220,0)');
      g.fillStyle = cg;
      g.beginPath();
      g.arc(0, sy * 0.05, sx * 0.2, 0, Math.PI * 2);
      g.fill();
      g.strokeStyle = 'rgba(40,36,70,0.35)';
      g.setLineDash([u * 0.06, u * 0.06]);
      g.lineWidth = u * 0.02;
      for (const s of [-1, 1]) {
        g.beginPath();
        g.moveTo(s * u * 0.5, -sy * 0.3);
        g.lineTo(s * u * 0.5, sy * 0.35);
        g.stroke();
      }
      g.setLineDash([]);
    }

    const blink = Math.sin(t * 0.9 + seed * 3) > 0.985 ? 0.15 : 1;
    const ey = e.type === 'king' ? -sy * 0.12 : -sy * 0.02, ex = e.type === 'king' ? sx * 0.1 : sx * 0.12;
    const er = u * (e.type === 'king' ? 0.055 : e.type === 'mote' ? 0.03 : 0.045);
    g.fillStyle = '#1b1d34';
    for (const s of [-1, 1]) {
      g.beginPath();
      g.ellipse(s * ex, ey, er, er * 1.3 * blink, 0, 0, Math.PI * 2);
      g.fill();
    }
    g.fillStyle = 'rgba(255,255,255,0.9)';
    for (const s of [-1, 1]) {
      g.beginPath();
      g.arc(s * ex + er * 0.35, ey - er * 0.45 * blink, er * 0.32, 0, Math.PI * 2);
      g.fill();
    }
    if (e.type === 'tint' && e.tint >= 0) gemIcon(g, e.tint, 0, sy * 0.2, u * 0.08);

    if (o.flash) {
      g.globalCompositeOperation = 'lighter';
      g.fillStyle = `rgba(255,255,255,${0.55 * o.flash})`;
      g.beginPath();
      g.ellipse(0, 0, sx * 0.5, sy * 0.45, 0, 0, Math.PI * 2);
      g.fill();
      g.globalCompositeOperation = 'source-over';
    }
    g.restore();
  }

  // ------------------------------------------------------------ lanterns
  function lantern(g, x, y, s, lit, t, seed) {
    const flick = lit ? 0.85 + 0.15 * Math.sin(t * 7 + seed * 5) * Math.sin(t * 3.1 + seed) : 0;
    g.save();
    g.translate(x, y);
    if (lit) {
      const glow = g.createRadialGradient(0, 0, s * 0.1, 0, 0, s * 1.35);
      glow.addColorStop(0, `rgba(255,190,90,${0.5 * flick})`);
      glow.addColorStop(0.4, `rgba(255,150,60,${0.16 * flick})`);
      glow.addColorStop(1, 'rgba(255,150,60,0)');
      g.fillStyle = glow;
      g.beginPath();
      g.arc(0, 0, s * 1.35, 0, Math.PI * 2);
      g.fill();
    }
    g.strokeStyle = '#6b5240';
    g.lineWidth = Math.max(1, s * 0.04);
    g.beginPath();
    g.moveTo(0, -s * 0.62);
    g.lineTo(0, -s * 0.36);
    g.stroke();
    const body = g.createRadialGradient(-s * 0.08, -s * 0.05, s * 0.02, 0, 0, s * 0.4);
    if (lit) {
      body.addColorStop(0, '#fff1c4');
      body.addColorStop(0.35, '#ffb14e');
      body.addColorStop(1, '#c2402b');
    } else {
      body.addColorStop(0, '#6a4b45');
      body.addColorStop(1, '#2d1f22');
    }
    g.fillStyle = body;
    g.beginPath();
    g.ellipse(0, 0, s * 0.3, s * 0.34, 0, 0, Math.PI * 2);
    g.fill();
    g.strokeStyle = lit ? 'rgba(120,30,20,0.45)' : 'rgba(0,0,0,0.35)';
    g.lineWidth = Math.max(1, s * 0.025);
    for (const k of [-0.5, 0, 0.5]) {
      g.beginPath();
      g.ellipse(0, 0, s * 0.3 * Math.abs(k) + 0.01, s * 0.34, 0, 0, Math.PI * 2);
      g.stroke();
    }
    g.fillStyle = lit ? '#d9a441' : '#4a3d33';
    g.fillRect(-s * 0.16, -s * 0.4, s * 0.32, s * 0.08);
    g.fillRect(-s * 0.16, s * 0.32, s * 0.32, s * 0.08);
    g.strokeStyle = lit ? '#e04a36' : '#4a3033';
    g.beginPath();
    g.moveTo(0, s * 0.4);
    g.lineTo(0, s * 0.62);
    g.stroke();
    g.restore();
  }

  // ------------------------------------------------------------ backdrops
  function rng(seed) {
    let s = seed | 0;
    return () => {
      let t = (s = (s + 0x6D2B79F5) | 0);
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  function ridge(g, w, base, amp, seed, color) {
    const r = rng(seed);
    g.fillStyle = color;
    g.beginPath();
    g.moveTo(0, base + 40);
    let y = base - amp * r();
    g.lineTo(0, y);
    const n = 9;
    for (let k = 1; k <= n; k++) {
      const x = (w * k) / n;
      y = base - amp * (0.25 + 0.75 * r());
      g.lineTo(x - w / n / 2, base - amp * (0.6 + 0.4 * r()) - amp * 0.2);
      g.lineTo(x, y);
    }
    g.lineTo(w, base + 400);
    g.lineTo(0, base + 400);
    g.closePath();
    g.fill();
  }

  // Sky above the gate: stars, moon, two mountain ridges and a fog band at the horizon.
  function sky(w, h, dpr, moon) {
    const cv = document.createElement('canvas');
    cv.width = Math.round(w * dpr);
    cv.height = Math.round(h * dpr);
    const g = cv.getContext('2d');
    g.scale(dpr, dpr);
    const bg = g.createLinearGradient(0, 0, 0, h);
    bg.addColorStop(0, '#060914');
    bg.addColorStop(0.55, '#0f1530');
    bg.addColorStop(1, '#232a52');
    g.fillStyle = bg;
    g.fillRect(0, 0, w, h);
    const r = rng(7);
    for (let k = 0; k < Math.round(w * h / 2600); k++) {
      const x = r() * w, y = r() * h * 0.75, a = 0.15 + r() * 0.65, s = r() < 0.9 ? 0.7 : 1.4;
      g.fillStyle = `rgba(242,232,210,${a})`;
      g.fillRect(x, y, s, s);
    }
    if (moon) {
      const mx = w * 0.8, my = h * 0.13, mr = Math.min(w, h) * 0.055;
      const halo = g.createRadialGradient(mx, my, mr, mx, my, mr * 5);
      halo.addColorStop(0, 'rgba(242,232,210,0.22)');
      halo.addColorStop(1, 'rgba(242,232,210,0)');
      g.fillStyle = halo;
      g.fillRect(mx - mr * 5, my - mr * 5, mr * 10, mr * 10);
      g.fillStyle = '#f4ead4';
      g.beginPath();
      g.arc(mx, my, mr, 0, Math.PI * 2);
      g.fill();
      g.fillStyle = 'rgba(15,21,48,0.9)';
      g.beginPath();
      g.arc(mx + mr * 0.45, my - mr * 0.2, mr * 0.92, 0, Math.PI * 2);
      g.fill();
    }
    ridge(g, w, h * 0.9, h * 0.22, 3, '#171d3b');
    ridge(g, w, h * 0.98, h * 0.14, 11, '#10152c');
    const fogBand = g.createLinearGradient(0, h * 0.72, 0, h);
    fogBand.addColorStop(0, 'rgba(207,203,230,0)');
    fogBand.addColorStop(1, 'rgba(207,203,230,0.12)');
    g.fillStyle = fogBand;
    g.fillRect(0, h * 0.72, w, h * 0.28);
    return cv;
  }

  function tray(st, S, dpr) {
    const w = st.W * S + S * 0.24, h = st.H * S + S * 0.24;
    const cv = document.createElement('canvas');
    cv.width = Math.round(w * dpr);
    cv.height = Math.round(h * dpr);
    const g = cv.getContext('2d');
    g.scale(dpr, dpr);
    const pad = S * 0.12;
    for (let y = 0; y < st.H; y++) for (let x = 0; x < st.W; x++) {
      const i = y * st.W + x;
      if (!st.mask[i]) continue;
      g.fillStyle = (x + y) % 2 ? '#151c35' : '#19213d';
      g.fillRect(pad + x * S, pad + y * S, S, S);
    }
    g.strokeStyle = 'rgba(207,203,230,0.1)';
    g.lineWidth = 1;
    for (let y = 0; y < st.H; y++) for (let x = 0; x < st.W; x++) {
      const i = y * st.W + x;
      if (!st.mask[i]) continue;
      g.strokeRect(pad + x * S + 0.5, pad + y * S + 0.5, S - 1, S - 1);
    }
    return cv;
  }

  // Icon canvases for the DOM (roster, cards, map).
  function foeIcon(type, px, tint) {
    const cv = document.createElement('canvas');
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    cv.width = cv.height = Math.round(px * dpr);
    const g = cv.getContext('2d');
    g.scale(dpr, dpr);
    const e = { id: 3, type, w: 1, tint: tint == null ? (type === 'tint' ? 3 : -1) : tint };
    fog(g, e, px / 2, px * 0.52, px * (type === 'king' ? 0.36 : 0.95), 0.4, {});
    return cv;
  }

  function lanternIcon(px, lit) {
    const cv = document.createElement('canvas');
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    cv.width = Math.round(px * dpr);
    cv.height = Math.round(px * 1.28 * dpr);
    const g = cv.getContext('2d');
    g.scale(dpr, dpr);
    lantern(g, px / 2, px * 0.68, px * 0.78, lit, 0.3, 1);
    return cv;
  }

  return { GEMS, FOG, gem, gemIcon, fog, lantern, sky, tray, foeIcon, lanternIcon, clearCache, rgba, mix, shapePath };
})();
</script>
<script>
/* Play screen. The engine resolves a whole turn at once and returns an event log; this module replays
   that log as animation, so what is drawn can never disagree with the rules. */
const Game = (() => {
  const E = Engine;
  const WHITE = E.WHITE;
  const reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const UI_FONT = '"Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif';

  let cv, g, stage;
  let dpr = 1, cw = 0, ch = 0;
  let S = 56, LH = 36, W = 7, H = 8, L = 6, bx = 0, laneTop = 0, gateY = 0, GH = 0, boardY = 0;
  let st = null, level = null;
  let skyCv = null, trayCv = null;
  const tiles = new Map();
  const foes = new Map();
  let fx = [], parts = [], motes = [], floats = [];
  const tweens = [];
  let busy = false, sel = -1, drag = null, aiming = false;
  let time = 0, last = 0, shake = 0;
  let wallShown = 3, chargeShown = 0, outAt = [];
  let hint = null, idleSince = 0;
  let speed = 1, auto = false, autoTimer = 0, autoBot = null, autoRng = null;
  let forced = null, paused = false;
  let hooks = {};
  let running = false;

  // ------------------------------------------------------------ tweening
  const ease = {
    out: (k) => 1 - Math.pow(1 - k, 3),
    in: (k) => k * k,
    inOut: (k) => (k < 0.5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2),
    back: (k) => { const c = 1.9; return 1 + (c + 1) * Math.pow(k - 1, 3) + c * Math.pow(k - 1, 2); },
  };
  function tween(obj, to, dur, fn) {
    return new Promise((res) => {
      if (!obj) return res();
      const d = dur / speed;
      if (d <= 1) { Object.assign(obj, to); return res(); }
      const from = {};
      for (const k in to) from[k] = obj[k];
      tweens.push({ obj, from, to, t: 0, d, fn: fn || ease.out, res });
    });
  }
  function wait(ms) {
    return new Promise((res) => {
      const d = ms / speed;
      if (d <= 1) return res();
      tweens.push({ obj: null, t: 0, d, res });
    });
  }
  function stepTweens(dt) {
    for (let i = tweens.length - 1; i >= 0; i--) {
      const tw = tweens[i];
      tw.t += dt;
      const k = Math.min(1, tw.t / tw.d);
      if (tw.obj) { const e = tw.fn(k); for (const p in tw.to) tw.obj[p] = tw.from[p] + (tw.to[p] - tw.from[p]) * e; }
      if (k >= 1) { tweens.splice(i, 1); tw.res(); }
    }
  }

  // ------------------------------------------------------------ geometry
  const cellX = (i) => i % W;
  const cellY = (i) => (i / W) | 0;
  const tilePx = (x, y) => [bx + x * S + S / 2, boardY + y * S + S / 2];
  const laneX = (x, w) => bx + (x + (w || 1) / 2) * S;
  const foeY = (p) => laneTop + p * LH + LH / 2;

  function layout() {
    if (!st) return;
    W = st.W; H = st.H; L = st.L;
    const aw = stage.clientWidth, ah = stage.clientHeight;
    const units = L * 0.64 + 0.55 + 1.05 + H + 0.2;
    S = Math.max(28, Math.floor(Math.min((aw - 12) / W, ah / units)));
    LH = Math.round(S * 0.64);
    cw = aw;
    ch = Math.round(S * units);
    bx = Math.round((cw - W * S) / 2);
    laneTop = Math.round(S * 0.55);
    gateY = laneTop + L * LH;
    GH = Math.round(S * 1.05);
    boardY = gateY + GH;
    dpr = Math.min(2, window.devicePixelRatio || 1);
    cv.width = Math.round(cw * dpr);
    cv.height = Math.round(ch * dpr);
    cv.style.width = cw + 'px';
    cv.style.height = ch + 'px';
    Art.clearCache();
    skyCv = Art.sky(cw, gateY + GH * 0.55, dpr, true);
    trayCv = Art.tray(st, S, dpr);
  }

  // ------------------------------------------------------------ view sync
  function foeView(e) {
    return { id: e.id, type: e.type, lane: e.lane, w: e.w, pos: e.pos, dpos: e.pos, hp: e.hp, dhp: e.hp, maxHp: e.maxHp, speed: e.speed, timer: e.timer, armor: e.armor, armorLeft: e.armor, tint: e.tint, core: e.core, atk: e.atk, a: 1, flash: 0, sc: 1 };
  }

  function syncAll() {
    const seen = new Set();
    for (let i = 0; i < st.N; i++) {
      if (st.col[i] === E.EMPTY) continue;
      const id = st.id[i];
      seen.add(id);
      let t = tiles.get(id);
      if (!t) { t = { id, s: 1, a: 1, glow: 0 }; tiles.set(id, t); }
      t.c = st.col[i]; t.sp = st.sp[i]; t.x = cellX(i); t.y = cellY(i); t.s = 1; t.a = 1; t.dying = false;
    }
    for (const id of [...tiles.keys()]) if (!seen.has(id)) tiles.delete(id);
    const fs = new Set();
    for (const e of st.enemies) {
      fs.add(e.id);
      const f = foes.get(e.id);
      if (!f) foes.set(e.id, foeView(e));
      else Object.assign(f, { lane: e.lane, pos: e.pos, dpos: e.pos, hp: e.hp, dhp: e.hp, maxHp: e.maxHp, timer: e.timer, armorLeft: e.armorLeft, a: 1, sc: 1, dead: false });
    }
    for (const id of [...foes.keys()]) if (!fs.has(id)) foes.delete(id);
    wallShown = st.wall;
    chargeShown = st.charge;
  }

  // ------------------------------------------------------------ effects
  function burst(x, y, c, white, n) {
    const col = white ? '#ffffff' : (Art.GEMS[c] ? Art.GEMS[c].base : '#ffffff');
    const count = reduced ? 3 : (n || 7);
    for (let k = 0; k < count; k++) {
      const a = Math.random() * Math.PI * 2, v = S * (1.2 + Math.random() * 2.2);
      parts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - S * 0.8, life: 0, max: 0.35 + Math.random() * 0.3, size: S * (0.05 + Math.random() * 0.05), col });
    }
  }
  function puff(x, y, col, n) {
    for (let k = 0; k < (reduced ? 3 : n || 10); k++) {
      const a = Math.random() * Math.PI * 2, v = S * (0.4 + Math.random() * 1.1);
      parts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - S * 0.3, life: 0, max: 0.6 + Math.random() * 0.4, size: S * (0.12 + Math.random() * 0.12), col, soft: true });
    }
  }
  function floatText(x, y, text, col, big) {
    floats.push({ x, y, text, col: col || '#fff', life: 0, max: big ? 1.1 : 0.75, big: !!big });
  }
  function addMote(x0, y0, x1, y1, col, dur, delay) {
    return new Promise((res) => {
      if (dur / speed <= 1) return res();
      motes.push({ x0, y0, x1, y1, col, t: -(delay || 0) / speed, d: dur / speed, res });
    });
  }
  function addFx(o) { o.t = 0; fx.push(o); }

  function actFx(a) {
    const cells = a.cells || [];
    const [cx, cy] = tilePx(cellX(a.i), cellY(a.i));
    const kind = a.kind;
    if (kind === E.SP.LINE_H) { addFx({ type: 'hbeam', y: cy, d: 0.35 }); Sound.line(); }
    else if (kind === E.SP.LINE_V) { addFx({ type: 'vbeam', x: cx, d: 0.35 }); Sound.line(); }
    else if (kind === E.SP.BOMB) { addFx({ type: 'ring', x: cx, y: cy, r: S * 1.6, d: 0.4 }); Sound.bomb(); shake = Math.max(shake, reduced ? 0 : 5); }
    else if (kind === 'CROSS') { addFx({ type: 'hbeam', y: cy, d: 0.4 }); addFx({ type: 'vbeam', x: cx, d: 0.4 }); Sound.line(); }
    else if (kind === 'CROSS3') {
      for (let d = -1; d <= 1; d++) { addFx({ type: 'hbeam', y: cy + d * S, d: 0.45 }); addFx({ type: 'vbeam', x: cx + d * S, d: 0.45 }); }
      Sound.line(); Sound.bomb();
    } else if (kind === 'BOMB5') { addFx({ type: 'ring', x: cx, y: cy, r: S * 2.8, d: 0.5 }); Sound.bomb(); shake = Math.max(shake, reduced ? 0 : 9); }
    else {
      const pts = cells.map((i) => tilePx(cellX(i), cellY(i)));
      addFx({ type: 'bolts', x: cx, y: cy, pts, d: 0.45 });
      Sound.rainbow();
    }
  }

  // ------------------------------------------------------------ event replay
  async function replay(log) {
    let pending = [], lastClear = null, lastShots = Promise.resolve();
    const flush = async () => { await Promise.all(pending); pending = []; };
    for (const ev of log) {
      if (ev.t === 'swap') await onSwap(ev);
      else if (ev.t === 'tap') await onTap(ev);
      else if (ev.t === 'clear') { await flush(); lastClear = ev; await onClear(ev); }
      else if (ev.t === 'shots') { lastShots = onShots(ev, lastClear); pending.push(lastShots); }
      else if (ev.t === 'spawn') {
        if (ev.why === 'split') { const p = lastShots.then(() => onSpawn(ev)); pending.push(p); }
        else { await flush(); await onSpawn(ev); }
      } else if (ev.t === 'fall') { pending.push(onFall(ev)); await flush(); }
      else if (ev.t === 'enemy') { await flush(); await onEnemy(ev); }
      else if (ev.t === 'skill') { await flush(); await onSkill(ev); }
      else if (ev.t === 'shuffle') { await flush(); await onShuffle(ev); }
    }
    await flush();
  }

  async function onSwap(ev) {
    const ta = tiles.get(ev.ida), tb = tiles.get(ev.idb);
    const ax = cellX(ev.a), ay = cellY(ev.a), bxx = cellX(ev.b), by = cellY(ev.b);
    Sound.swap();
    await Promise.all([tween(ta, { x: bxx, y: by }, 150), tween(tb, { x: ax, y: ay }, 150)]);
    if (!ev.ok) {
      Sound.nope();
      await Promise.all([tween(ta, { x: ax, y: ay }, 150), tween(tb, { x: bxx, y: by }, 150)]);
    }
  }

  async function onTap(ev) {
    const t = tiles.get(ev.id);
    await tween(t, { s: 1.32 }, 90);
    await tween(t, { s: 1 }, 80);
  }

  async function onClear(ev) {
    if (ev.convert) {
      for (const [, kind, id] of ev.convert) { const t = tiles.get(id); if (t) { t.sp = kind; t.glow = 1; } }
      const src = ev.acts[0];
      const [ox, oy] = tilePx(cellX(src.i), cellY(src.i));
      addFx({ type: 'bolts', x: ox, y: oy, pts: ev.convert.map(([i]) => tilePx(cellX(i), cellY(i))), d: 0.4 });
      Sound.rainbow();
      await wait(260);
    }
    for (const a of ev.acts) actFx(a);
    if (!ev.acts.length) Sound.match(ev.depth);
    else if (ev.depth > 1) Sound.match(ev.depth);
    if (ev.depth >= 2 && ev.cells.length) {
      let sx = 0, sy = 0;
      for (const i of ev.cells) { const p = tilePx(cellX(i), cellY(i)); sx += p[0]; sy += p[1]; }
      floatText(sx / ev.cells.length, sy / ev.cells.length, '连锁 ×' + ev.depth, '#ffe2a8', ev.depth >= 4);
    }
    ev.ids.forEach((id, k) => {
      const t = tiles.get(id);
      if (!t) return;
      t.dying = true;
      const [px, py] = tilePx(t.x, t.y);
      burst(px, py, ev.cols[k], ev.causes[k] === 2);
      tween(t, { s: 1.22 }, 60).then(() => tween(t, { s: 0.15, a: 0 }, 150)).then(() => { if (tiles.get(id) === t) tiles.delete(id); });
    });
    for (const cr of ev.creates) {
      const t = tiles.get(cr.id);
      if (!t) continue;
      t.sp = cr.kind; t.c = cr.c; t.glow = 1;
      tween(t, { glow: 0 }, 700);
      Sound.create();
      if (hooks.onCreate) hooks.onCreate(cr.kind);
    }
    await wait(ev.acts.length ? 190 : 130);
  }

  async function onShots(ev, clear) {
    const jobs = [];
    for (const ln of ev.lanes) {
      const origins = clear ? clear.cells.filter((i) => cellX(i) === ln.lane) : [];
      let target = null;
      for (const h of ln.hits) { const f = foes.get(h.e); if (f) { target = f; break; } }
      const tx = laneX(ln.lane, 1);
      const ty = target ? foeY(target.dpos) + LH * 0.1 : -LH;
      let col = '#ffffff';
      if (!ln.white) { let best = -1, bc = 0; ln.byColor.forEach((n, c) => { if (n > best) { best = n; bc = c; } }); col = Art.GEMS[bc].base; }
      const count = Math.min(5, Math.max(1, origins.length || ln.n));
      let first = null;
      for (let k = 0; k < count; k++) {
        const o = origins.length ? origins[k % origins.length] : null;
        const [ox, oy] = o != null ? tilePx(cellX(o), cellY(o)) : [tx, gateY + GH];
        const p = addMote(ox + (Math.random() - 0.5) * S * 0.2, oy, tx + (Math.random() - 0.5) * S * 0.25, ty, col, 230 + Math.abs(oy - ty) * 0.18, k * 32);
        if (!first) first = p;
      }
      jobs.push(first.then(() => applyHits(ln)));
    }
    await Promise.all(jobs);
    chargeShown = ev.charge;
    if (hooks.onCharge) hooks.onCharge(ev.charge);
  }

  // One floating number per fog per lane per step: shots of several colours arrive as separate records.
  async function applyHits(ln) {
    const byFoe = new Map();
    for (const h of ln.hits) {
      let r = byFoe.get(h.e);
      if (!r) byFoe.set(h.e, r = { d: 0, a: 0, arm: 0, hp: h.hp, k: 0, white: false, c: h.c });
      r.d += h.d || 0; r.a += h.a || 0; r.arm += h.arm || 0;
      if (h.d) { r.hp = h.hp; if (h.c === WHITE) r.white = true; else r.c = h.c; }
      if (h.k) r.k = 1;
    }
    for (const [id, r] of byFoe) {
      const f = foes.get(id);
      if (!f) continue;
      const x = laneX(ln.lane, 1), y = foeY(f.dpos);
      if (r.arm) { floatText(x, y - LH * 0.2, '雾袖', '#cfc8ec'); Sound.armor(); f.flash = 0.35; }
      if (r.a) {
        f.armorLeft = Math.max(0, (f.armorLeft == null ? f.armor : f.armorLeft) - r.a);
        floatText(x - S * 0.18, y - LH * 0.45, '挡 ' + r.a, '#d7d0e3');
        Sound.armor();
        f.flash = 0.4;
      }
      if (r.d) {
        f.dhp = r.hp;
        f.flash = 1;
        floatText(x + S * 0.12, y - LH * 0.2, '−' + r.d, r.white ? '#ffffff' : (Art.GEMS[r.c] ? Art.GEMS[r.c].light : '#fff'));
        Sound.hit();
      }
      if (r.k) killFoe(f);
      await wait(40);
    }
  }

  function killFoe(f) {
    if (f.dead) return;
    f.dead = true;
    Sound.kill();
    puff(laneX(f.lane, f.w), foeY(f.dpos), '#e4e0f7', f.w > 1 ? 26 : 12);
    tween(f, { a: 0, sc: 1.35 }, 300).then(() => { if (foes.get(f.id) === f) foes.delete(f.id); });
    if (hooks.onKill) hooks.onKill(f);
  }

  async function onSpawn(ev) {
    Sound.spawn();
    const jobs = ev.list.map((e) => {
      const f = foeView(e);
      f.dpos = e.pos - 0.8; f.a = 0;
      foes.set(e.id, f);
      if (ev.why === 'split') { f.dpos = e.pos; f.sc = 0.4; return tween(f, { a: 1, sc: 1 }, 260); }
      return tween(f, { dpos: e.pos, a: 1 }, 360);
    });
    await Promise.all(jobs);
    if (hooks.onSpawn) hooks.onSpawn(ev.list);
  }

  async function onFall(ev) {
    const jobs = [];
    for (const m of ev.moves) {
      const t = tiles.get(m.id);
      if (!t) continue;
      const ty = cellY(m.to), d = Math.max(0, ty - t.y);
      jobs.push(tween(t, { y: ty }, 80 + 60 * Math.sqrt(d), ease.in));
    }
    for (const sp of ev.spawns) {
      const y = cellY(sp.to);
      const t = { id: sp.id, c: sp.c, sp: 0, x: cellX(sp.to), y: sp.fromRow, s: 1, a: 1, glow: 0 };
      tiles.set(sp.id, t);
      jobs.push(tween(t, { y }, 80 + 60 * Math.sqrt(y - sp.fromRow), ease.in));
    }
    await Promise.all(jobs);
  }

  async function onEnemy(ev) {
    const jobs = [];
    if (ev.moved.length) Sound.step();
    for (const m of ev.moved) {
      const f = foes.get(m.e);
      if (!f) continue;
      f.pos = m.pos;
      jobs.push(tween(f, { dpos: m.pos }, 280, ease.inOut));
    }
    for (const b of ev.breaches) {
      const f = foes.get(b.e);
      if (!f) continue;
      jobs.push(tween(f, { dpos: L + 0.35 }, 240, ease.in).then(() => {
        foes.delete(f.id);
        Sound.breach();
        shake = reduced ? 0 : 14;
        const lost = wallShown - b.wall;
        for (let k = 0; k < lost; k++) outAt.push({ index: wallShown - 1 - k, t: time });
        wallShown = b.wall;
        puff(laneX(f.lane, f.w), gateY + GH * 0.45, '#8f86b3', 16);
        if (hooks.onBreach) hooks.onBreach(b);
      }));
    }
    await Promise.all(jobs);
    if (ev.summons && ev.summons.length) await onSpawn({ list: ev.summons, why: 'summon' });
  }

  async function onSkill(ev) {
    Sound.skill();
    addFx({ type: 'skill', x: laneX(ev.lane, 1), d: 0.7 });
    chargeShown = ev.charge;
    if (hooks.onCharge) hooks.onCharge(ev.charge);
    await wait(260);
    for (const h of ev.hits) {
      const f = foes.get(h.e);
      if (!f) continue;
      f.dhp = h.hp; f.flash = 1;
      floatText(laneX(ev.lane, 1), foeY(f.dpos) - LH * 0.3, '−' + h.d, '#ffe7b0', true);
      if (h.k) killFoe(f);
      await wait(60);
    }
    await wait(200);
  }

  async function onShuffle(ev) {
    Sound.shuffle();
    if (hooks.onToast) hooks.onToast('萤石重排');
    await Promise.all(ev.tiles.map((m) => { const t = tiles.get(m.id); if (!t) return null; t.c = m.c; return tween(t, { x: cellX(m.to), y: cellY(m.to) }, 420, ease.inOut); }));
  }

  // ------------------------------------------------------------ turn driver
  async function run(fn) {
    if (busy || !st || st.over) return false;
    busy = true;
    hint = null;
    sel = -1;
    st.log = [];
    const ok = fn();
    const log = st.log;
    st.log = null;
    await replay(log);
    syncAll();
    busy = false;
    idleSince = time;
    if (hooks.onTurn) hooks.onTurn(ok, log);
    if (st.over) {
      await wait(450);
      if (hooks.onEnd) hooks.onEnd(st);
    } else if (auto) scheduleAuto();
    return ok;
  }

  function attempt(a, b) {
    if (forced) {
      const okDrag = forced.kind === 'drag' && ((forced.a === a && forced.b === b) || (forced.a === b && forced.b === a));
      if (!okDrag) { Sound.nope(); if (hooks.onBlocked) hooks.onBlocked(); return; }
      forced = null;
    }
    run(() => E.play(st, a, b));
  }

  function attemptTap(i) {
    if (forced) {
      if (!(forced.kind === 'tap' && forced.i === i)) { Sound.nope(); if (hooks.onBlocked) hooks.onBlocked(); return; }
      forced = null;
    }
    run(() => E.play(st, i, -1));
  }

  function useSkill(lane) {
    aiming = false;
    if (hooks.onAim) hooks.onAim(false);
    run(() => E.skill(st, lane));
  }

  function scheduleAuto() {
    clearTimeout(autoTimer);
    autoTimer = setTimeout(() => {
      if (!auto || busy || paused || !st || st.over) return;
      const d = autoBot(st, autoRng);
      if (d.skill != null) run(() => E.skill(st, d.skill));
      else if (d.move) run(() => E.play(st, d.move[0], d.move[1]));
    }, 380 / speed);
  }

  // ------------------------------------------------------------ input
  function local(e) {
    const r = cv.getBoundingClientRect();
    return { x: e.clientX - r.left, y: e.clientY - r.top };
  }
  function cellAt(p) {
    const x = Math.floor((p.x - bx) / S), y = Math.floor((p.y - boardY) / S);
    if (x < 0 || y < 0 || x >= W || y >= H) return -1;
    const i = y * W + x;
    return st.mask[i] && st.col[i] !== E.EMPTY ? i : -1;
  }
  function laneAt(p) {
    const x = Math.floor((p.x - bx) / S);
    return x >= 0 && x < W && p.y < boardY + H * S ? x : -1;
  }

  function onDown(e) {
    Sound.resume();
    if (!st || busy || st.over || auto) return;
    const p = local(e);
    if (aiming) {
      const lane = laneAt(p);
      if (lane >= 0) useSkill(lane);
      return;
    }
    const i = cellAt(p);
    if (i < 0) { sel = -1; return; }
    drag = { i, x: p.x, y: p.y };
    try { cv.setPointerCapture(e.pointerId); } catch (err) { /* capture is optional */ }
  }
  function onMove(e) {
    if (!drag) return;
    const p = local(e);
    const dx = p.x - drag.x, dy = p.y - drag.y;
    if (Math.max(Math.abs(dx), Math.abs(dy)) < S * 0.38) return;
    const a = drag.i;
    drag = null;
    let b;
    if (Math.abs(dx) > Math.abs(dy)) b = dx > 0 ? (cellX(a) < W - 1 ? a + 1 : -1) : (cellX(a) > 0 ? a - 1 : -1);
    else b = dy > 0 ? (a + W < st.N ? a + W : -1) : (a - W >= 0 ? a - W : -1);
    if (b < 0 || !st.mask[b] || st.col[b] === E.EMPTY) return;
    attempt(a, b);
  }
  function onUp() {
    if (!drag) return;
    const i = drag.i;
    drag = null;
    if (sel >= 0 && sel !== i && E.adjacent(st, sel, i)) { const a = sel; sel = -1; attempt(a, i); return; }
    if (st.sp[i]) { sel = -1; attemptTap(i); return; }
    sel = sel === i ? -1 : i;
    Sound.click();
  }

  // ------------------------------------------------------------ drawing
  // requestAnimationFrame stops while the page is hidden; the interval keeps a turn in progress moving.
  let lastFrameAt = 0;
  function frame(now, fromTimer) {
    if (!fromTimer) lastFrameAt = now;
    const dt = Math.min(0.05, (now - last) / 1000 || 0);
    last = now;
    time += dt;
    stepTweens(dt * 1000);
    for (let i = parts.length - 1; i >= 0; i--) {
      const p = parts[i];
      p.life += dt;
      if (p.life >= p.max) { parts.splice(i, 1); continue; }
      p.x += p.vx * dt; p.y += p.vy * dt;
      p.vy += S * (p.soft ? -0.6 : 6) * dt;
      p.vx *= p.soft ? 0.96 : 0.99;
    }
    for (let i = motes.length - 1; i >= 0; i--) {
      const m = motes[i];
      m.t += dt * 1000;
      if (m.t >= m.d) { motes.splice(i, 1); m.res(); }
    }
    for (let i = fx.length - 1; i >= 0; i--) { fx[i].t += dt; if (fx[i].t >= fx[i].d) fx.splice(i, 1); }
    for (let i = floats.length - 1; i >= 0; i--) { floats[i].life += dt; if (floats[i].life >= floats[i].max) floats.splice(i, 1); }
    shake *= 0.86;
    if (st) draw();
    if (!fromTimer) requestAnimationFrame(frame);
  }

  function draw() {
    g.setTransform(dpr, 0, 0, dpr, 0, 0);
    g.fillStyle = '#10152a';
    g.fillRect(0, 0, cw, ch);
    if (shake > 0.3) g.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
    g.drawImage(skyCv, 0, 0, cw, gateY + GH * 0.55);
    drawLanes();
    drawFoes();
    drawGate();
    g.drawImage(trayCv, bx - S * 0.12, boardY - S * 0.12, W * S + S * 0.24, H * S + S * 0.24);
    drawTiles();
    drawGuides();
    drawFx();
    drawMotes();
    drawParts();
    drawFloats();
  }

  function drawLanes() {
    g.save();
    for (let x = 0; x < W; x++) {
      const lx = bx + x * S;
      g.fillStyle = x % 2 ? 'rgba(207,203,230,0.028)' : 'rgba(207,203,230,0.012)';
      g.fillRect(lx, laneTop - LH * 0.3, S, L * LH + LH * 0.3);
    }
    g.fillStyle = 'rgba(207,203,230,0.16)';
    for (let x = 0; x < W; x++) for (let p = 0; p < L; p++) {
      g.beginPath();
      g.arc(laneX(x, 1), foeY(p), Math.max(1, S * 0.025), 0, Math.PI * 2);
      g.fill();
    }
    const nw = E.nextWave(st);
    if (nw && nw.turn === st.turn + 1 && !busy) {
      const pulse = 0.5 + 0.5 * Math.sin(time * 5);
      g.fillStyle = `rgba(255,180,79,${0.35 + 0.4 * pulse})`;
      for (const x of nw.lanes) {
        const cx = laneX(Math.min(W - 1, x), 1), cy = laneTop - LH * 0.05;
        g.beginPath();
        g.moveTo(cx - S * 0.14, cy - S * 0.08);
        g.lineTo(cx + S * 0.14, cy - S * 0.08);
        g.lineTo(cx, cy + S * 0.06);
        g.closePath();
        g.fill();
      }
    }
    if (aiming) {
      const pulse = 0.5 + 0.5 * Math.sin(time * 6);
      for (let x = 0; x < W; x++) {
        const grd = g.createLinearGradient(0, laneTop, 0, boardY + H * S);
        grd.addColorStop(0, `rgba(255,180,79,${0.02 + 0.06 * pulse})`);
        grd.addColorStop(0.6, `rgba(255,180,79,${0.1 + 0.08 * pulse})`);
        grd.addColorStop(1, 'rgba(255,180,79,0)');
        g.fillStyle = grd;
        g.fillRect(bx + x * S + 2, laneTop - LH * 0.3, S - 4, boardY + H * S - laneTop);
      }
    }
    g.restore();
  }

  function drawFoes() {
    const list = [...foes.values()].sort((p, q) => p.dpos - q.dpos);
    for (const f of list) {
      const x = laneX(f.lane, f.w), y = foeY(f.dpos);
      f.flash = Math.max(0, (f.flash || 0) - 0.08);
      const danger = !f.dead && f.pos === L - 1 && f.timer === 1 && !busy;
      Art.fog(g, f, x, y, S, time, { flash: f.flash, alpha: f.a, danger, scale: f.sc });
      if (f.dead || f.a < 0.5) continue;
      drawFoeBadge(f, x, y, danger);
    }
  }

  function drawFoeBadge(f, x, y, danger) {
    const u = S;
    const by = y + LH * 0.5;
    const text = String(Math.max(0, Math.round(f.dhp)));
    g.font = `700 ${Math.round(u * 0.24)}px ${UI_FONT}`;
    const tw = g.measureText(text).width;
    const pw = Math.max(u * 0.42, tw + u * 0.2), ph = u * 0.3;
    g.fillStyle = danger ? 'rgba(120,20,20,0.92)' : 'rgba(10,12,26,0.82)';
    roundRect(x - pw / 2, by - ph / 2, pw, ph, ph / 2);
    g.fill();
    if (f.tint >= 0) {
      g.strokeStyle = Art.GEMS[f.tint].base;
      g.lineWidth = Math.max(1.5, u * 0.035);
      g.stroke();
    }
    const ratio = Math.max(0, f.dhp / f.maxHp);
    g.fillStyle = danger ? '#ff8b7f' : 'rgba(207,203,230,0.35)';
    roundRect(x - pw / 2 + ph * 0.3, by + ph / 2 - u * 0.045, (pw - ph * 0.6) * ratio, u * 0.03, u * 0.015);
    g.fill();
    g.fillStyle = '#f2e8d2';
    g.textAlign = 'center';
    g.textBaseline = 'middle';
    g.fillText(text, x, by + u * 0.005);
    const pipY = by + ph / 2 + u * 0.09;
    const n = f.speed, filled = Math.max(0, Math.min(n, f.timer));
    for (let k = 0; k < n; k++) {
      const px = x + (k - (n - 1) / 2) * u * 0.12;
      g.beginPath();
      g.arc(px, pipY, u * 0.035, 0, Math.PI * 2);
      g.fillStyle = k < filled ? (danger ? '#ff5d4d' : '#cfcbe6') : 'rgba(207,203,230,0.18)';
      g.fill();
    }
    if (f.armor) {
      for (let k = 0; k < f.armor; k++) {
        const sx = x - pw / 2 - u * 0.1 - k * u * 0.13, sy = by;
        g.beginPath();
        g.moveTo(sx, sy - u * 0.07);
        g.lineTo(sx + u * 0.055, sy - u * 0.04);
        g.lineTo(sx + u * 0.045, sy + u * 0.04);
        g.lineTo(sx, sy + u * 0.075);
        g.lineTo(sx - u * 0.045, sy + u * 0.04);
        g.lineTo(sx - u * 0.055, sy - u * 0.04);
        g.closePath();
        g.fillStyle = k < (f.armorLeft == null ? f.armor : f.armorLeft) ? '#b8aec6' : 'rgba(184,174,198,0.2)';
        g.fill();
      }
    }
    if (danger) {
      g.fillStyle = '#ff5d4d';
      g.font = `700 ${Math.round(u * 0.3)}px sans-serif`;
      g.fillText('!', x + (f.w > 1 ? u * 1.1 : u * 0.36), y - LH * 0.35);
    }
  }

  function roundRect(x, y, w, h, r) {
    g.beginPath();
    g.moveTo(x + r, y);
    g.arcTo(x + w, y, x + w, y + h, r);
    g.arcTo(x + w, y + h, x, y + h, r);
    g.arcTo(x, y + h, x, y, r);
    g.arcTo(x, y, x + w, y, r);
    g.closePath();
  }

  function drawGate() {
    const y = gateY + GH * 0.12;
    g.save();
    const beam = g.createLinearGradient(0, y, 0, y + S * 0.16);
    beam.addColorStop(0, '#6b4c38');
    beam.addColorStop(1, '#2d1f18');
    g.fillStyle = beam;
    g.fillRect(bx - S * 0.3, y, W * S + S * 0.6, S * 0.16);
    g.fillStyle = 'rgba(255,220,170,0.12)';
    g.fillRect(bx - S * 0.3, y, W * S + S * 0.6, 1.5);
    const n = st.wallMax;
    for (let k = 0; k < n; k++) {
      const lx = bx + (W * S * (k + 0.5)) / n, ly = y + S * 0.62;
      const lit = k < wallShown;
      Art.lantern(g, lx, ly, S * 0.62, lit, time, k + 1);
      const out = outAt.find((o) => o.index === k);
      if (out && time - out.t < 1.2) {
        const age = (time - out.t) / 1.2;
        g.fillStyle = `rgba(160,150,190,${0.35 * (1 - age)})`;
        g.beginPath();
        g.arc(lx, ly - S * 0.3 - age * S * 0.6, S * (0.15 + age * 0.3), 0, Math.PI * 2);
        g.fill();
      }
    }
    g.restore();
  }

  function drawTiles() {
    g.save();
    g.beginPath();
    g.rect(bx - 2, boardY - 2, W * S + 4, H * S + 4);
    g.clip();
    const px = Math.round(S * dpr);
    for (const t of tiles.values()) {
      const [x, y] = tilePx(t.x, t.y);
      const sz = S * t.s;
      if (t.a <= 0.01) continue;
      g.globalAlpha = t.a;
      const img = Art.gem(t.c === E.UNK ? 0 : t.c, t.sp, px);
      if (t.glow > 0.01) {
        g.save();
        g.globalCompositeOperation = 'lighter';
        g.globalAlpha = t.glow * 0.7;
        g.fillStyle = '#fff4d6';
        g.beginPath();
        g.arc(x, y, S * 0.5, 0, Math.PI * 2);
        g.fill();
        g.restore();
        g.globalAlpha = t.a;
      }
      if (t.sp) {
        const pulse = 1 + 0.04 * Math.sin(time * 5 + t.id);
        g.drawImage(img, x - (sz * pulse) / 2, y - (sz * pulse) / 2, sz * pulse, sz * pulse);
      } else g.drawImage(img, x - sz / 2, y - sz / 2, sz, sz);
    }
    g.globalAlpha = 1;
    g.restore();
  }

  function ringCell(i, col, width, pulse) {
    const [x, y] = tilePx(cellX(i), cellY(i));
    g.strokeStyle = col;
    g.lineWidth = width;
    roundRect(x - S * 0.46 * pulse, y - S * 0.46 * pulse, S * 0.92 * pulse, S * 0.92 * pulse, S * 0.18);
    g.stroke();
  }

  function drawGuides() {
    g.save();
    if (sel >= 0 && !busy) ringCell(sel, 'rgba(255,230,180,0.95)', 2.5, 1);
    if (forced && !busy) {
      const pulse = 1 + 0.05 * Math.sin(time * 6);
      if (forced.kind === 'drag') {
        ringCell(forced.a, 'rgba(255,180,79,0.95)', 3, pulse);
        ringCell(forced.b, 'rgba(255,180,79,0.6)', 2, pulse);
        const k = (time * 0.9) % 1;
        const [ax, ay] = tilePx(cellX(forced.a), cellY(forced.a));
        const [bx2, by2] = tilePx(cellX(forced.b), cellY(forced.b));
        const e = ease.inOut(Math.min(1, k * 1.4));
        const hx = ax + (bx2 - ax) * e, hy = ay + (by2 - ay) * e;
        g.globalAlpha = k < 0.85 ? 1 : (1 - k) / 0.15;
        g.fillStyle = 'rgba(255,244,214,0.95)';
        g.beginPath();
        g.arc(hx + S * 0.12, hy + S * 0.14, S * 0.16, 0, Math.PI * 2);
        g.fill();
        g.strokeStyle = 'rgba(40,28,10,0.6)';
        g.lineWidth = 2;
        g.stroke();
        g.globalAlpha = 1;
      } else if (forced.kind === 'tap') {
        ringCell(forced.i, 'rgba(255,180,79,0.95)', 3, pulse);
      }
    } else if (hint && !busy && !aiming) {
      const pulse = 1 + 0.06 * Math.sin(time * 7);
      ringCell(hint[0], 'rgba(242,232,210,0.55)', 2, pulse);
      if (hint[1] >= 0) ringCell(hint[1], 'rgba(242,232,210,0.55)', 2, pulse);
    }
    g.restore();
    if (!busy && !auto && !forced && st && !st.over && hint === null && time - idleSince > 8) {
      const d = Bots.BOTS.strategic(st, Math.random);
      hint = d.move || false;
      if (d.skill != null && hooks.onHintSkill) hooks.onHintSkill();
    }
  }

  function drawFx() {
    g.save();
    g.globalCompositeOperation = 'lighter';
    for (const f of fx) {
      const k = f.t / f.d, fade = 1 - k;
      if (f.type === 'hbeam' || f.type === 'vbeam') {
        const thick = S * 0.5 * (1 - k * 0.6);
        const grd = f.type === 'hbeam' ? g.createLinearGradient(0, f.y - thick, 0, f.y + thick) : g.createLinearGradient(f.x - thick, 0, f.x + thick, 0);
        grd.addColorStop(0, 'rgba(255,240,200,0)');
        grd.addColorStop(0.5, `rgba(255,248,225,${0.95 * fade})`);
        grd.addColorStop(1, 'rgba(255,240,200,0)');
        g.fillStyle = grd;
        if (f.type === 'hbeam') g.fillRect(bx - S * 0.2, f.y - thick, W * S + S * 0.4, thick * 2);
        else g.fillRect(f.x - thick, boardY - S * 0.1, thick * 2, H * S + S * 0.2);
      } else if (f.type === 'ring') {
        g.strokeStyle = `rgba(255,236,200,${fade})`;
        g.lineWidth = S * 0.22 * fade + 1;
        g.beginPath();
        g.arc(f.x, f.y, f.r * ease.out(k), 0, Math.PI * 2);
        g.stroke();
        const glow = g.createRadialGradient(f.x, f.y, 0, f.x, f.y, f.r);
        glow.addColorStop(0, `rgba(255,220,160,${0.5 * fade})`);
        glow.addColorStop(1, 'rgba(255,220,160,0)');
        g.fillStyle = glow;
        g.beginPath();
        g.arc(f.x, f.y, f.r, 0, Math.PI * 2);
        g.fill();
      } else if (f.type === 'bolts') {
        g.strokeStyle = `rgba(245,235,255,${0.9 * fade})`;
        g.lineWidth = 2;
        for (const [px, py] of f.pts) {
          g.beginPath();
          g.moveTo(f.x, f.y);
          const mx = (f.x + px) / 2 + (Math.random() - 0.5) * S * 0.5, my = (f.y + py) / 2 + (Math.random() - 0.5) * S * 0.5;
          g.lineTo(mx, my);
          g.lineTo(px, py);
          g.stroke();
        }
      } else if (f.type === 'skill') {
        const w = S * (0.4 + 0.5 * Math.sin(Math.min(1, k * 2) * Math.PI / 2)) * fade;
        const grd = g.createLinearGradient(f.x - w, 0, f.x + w, 0);
        grd.addColorStop(0, 'rgba(255,190,90,0)');
        grd.addColorStop(0.5, `rgba(255,236,190,${fade})`);
        grd.addColorStop(1, 'rgba(255,190,90,0)');
        g.fillStyle = grd;
        g.fillRect(f.x - w, 0, w * 2, gateY + GH * 0.6);
      }
    }
    g.restore();
  }

  function drawMotes() {
    g.save();
    g.globalCompositeOperation = 'lighter';
    for (const m of motes) {
      if (m.t < 0) continue;
      const k = ease.in(Math.min(1, m.t / m.d));
      const x = m.x0 + (m.x1 - m.x0) * k, y = m.y0 + (m.y1 - m.y0) * k;
      const k2 = ease.in(Math.max(0, m.t / m.d - 0.12));
      const tx = m.x0 + (m.x1 - m.x0) * k2, ty = m.y0 + (m.y1 - m.y0) * k2;
      g.strokeStyle = Art.rgba(m.col, 0.55);
      g.lineWidth = S * 0.07;
      g.lineCap = 'round';
      g.beginPath();
      g.moveTo(tx, ty);
      g.lineTo(x, y);
      g.stroke();
      const grd = g.createRadialGradient(x, y, 0, x, y, S * 0.2);
      grd.addColorStop(0, 'rgba(255,255,255,1)');
      grd.addColorStop(0.3, Art.rgba(m.col, 0.9));
      grd.addColorStop(1, Art.rgba(m.col, 0));
      g.fillStyle = grd;
      g.beginPath();
      g.arc(x, y, S * 0.2, 0, Math.PI * 2);
      g.fill();
    }
    g.restore();
  }

  function drawParts() {
    g.save();
    for (const p of parts) {
      const k = p.life / p.max;
      g.globalAlpha = (1 - k) * (p.soft ? 0.45 : 1);
      g.fillStyle = p.col;
      g.beginPath();
      g.arc(p.x, p.y, p.size * (p.soft ? 1 + k : 1 - k * 0.5), 0, Math.PI * 2);
      g.fill();
    }
    g.restore();
  }

  function drawFloats() {
    g.save();
    g.textAlign = 'center';
    g.textBaseline = 'middle';
    for (const f of floats) {
      const k = f.life / f.max;
      g.globalAlpha = k < 0.7 ? 1 : 1 - (k - 0.7) / 0.3;
      const size = Math.round(S * (f.big ? 0.42 : 0.28) * (k < 0.15 ? 0.8 + k * 1.4 : 1));
      g.font = `700 ${size}px ${UI_FONT}`;
      g.lineWidth = 3;
      g.strokeStyle = 'rgba(8,10,22,0.85)';
      const y = Math.max(size * 0.6, f.y - k * S * 0.6);
      g.strokeText(f.text, f.x, y);
      g.fillStyle = f.col;
      g.fillText(f.text, f.x, y);
    }
    g.restore();
  }

  // ------------------------------------------------------------ public
  function init(canvas, stageEl, h) {
    cv = canvas;
    stage = stageEl;
    g = cv.getContext('2d');
    hooks = h || {};
    cv.addEventListener('pointerdown', onDown);
    cv.addEventListener('pointermove', onMove);
    cv.addEventListener('pointerup', onUp);
    cv.addEventListener('pointercancel', () => { drag = null; });
    window.addEventListener('resize', () => { if (st) layout(); });
    if (!running) {
      running = true;
      requestAnimationFrame((t) => { last = t; frame(t); });
      setInterval(() => { const now = performance.now(); if (now - lastFrameAt > 250) frame(now, true); }, 50);
    }
  }

  function start(lvl, seed) {
    level = lvl;
    st = E.create(lvl, seed, { log: true });
    const log = st.log;
    st.log = null;
    tiles.clear(); foes.clear();
    fx = []; parts = []; motes = []; floats = []; tweens.length = 0; outAt = [];
    busy = false; sel = -1; drag = null; aiming = false; hint = null; forced = null;
    clearTimeout(autoTimer);
    layout();
    syncAll();
    idleSince = time;
    for (const ev of log) if (ev.t === 'spawn') for (const e of ev.list) {
      const f = foes.get(e.id);
      if (f) { f.dpos = e.pos - 0.8; f.a = 0; tween(f, { dpos: e.pos, a: 1 }, 520); }
    }
    return st;
  }

  function stop() { clearTimeout(autoTimer); auto = false; st = null; }

  function setAuto(on, profile) {
    auto = !!on;
    autoBot = Bots.make(profile || 'strategic');
    autoRng = Bots.mulberry((Math.random() * 1e9) | 0);
    forced = null;
    aiming = false;
    if (auto && st && !busy && !st.over) scheduleAuto();
  }

  function toggleAim() {
    if (!st || busy || st.over || auto) return false;
    if (st.charge < (st.rules || E.RULES).chargeMax) return false;
    aiming = !aiming;
    if (hooks.onAim) hooks.onAim(aiming);
    return aiming;
  }

  function setForced(f) { forced = f; }
  function setPaused(v) { paused = v; if (!v && auto && st && !busy && !st.over) scheduleAuto(); }
  function setSpeed(v) { speed = v; }

  return {
    init, start, stop, setAuto, setSpeed, toggleAim, setForced, setPaused,
    get state() { return st; },
    get busy() { return busy; },
    get auto() { return auto; },
    get aiming() { return aiming; },
    cellPos(i) { const [x, y] = tilePx(cellX(i), cellY(i)); return { x, y, S }; },
    foePos(f) { return { x: laneX(f.lane, f.w), y: foeY(f.pos), S, LH }; },
    geometry() { return { S, LH, bx, laneTop, gateY, GH, boardY, W, H, L, cw, ch }; },
    playMove: (a, b) => run(() => E.play(st, a, b)),
    useSkill,
    sync: () => syncAll(),
    snapshot: () => cv.toDataURL('image/png'),
  };
})();
</script>
<script>
/* Screens, level cards, onboarding and the numbers panel. */
(() => {
  const E = Engine;
  const $ = (id) => document.getElementById(id);
  const LEVELS = Levels.LEVELS;
  const SIM = window.SIM || { levels: {} };
  const KEY = 'shoudengren_v1';

  const save = { stars: {}, seen: {}, best: 0, sound: true, openAll: false };
  try { Object.assign(save, JSON.parse(localStorage.getItem(KEY) || '{}')); } catch (e) { /* storage unavailable */ }
  const persist = () => { try { localStorage.setItem(KEY, JSON.stringify(save)); } catch (e) { /* storage unavailable */ } };
  Sound.on = save.sound !== false;

  const FOE_TEXT = {
    wisp: '最常见的雾，每两回合向下一格。',
    swift: '每回合都向下一格，留给你的时间只有雾团的一半。',
    shell: '岩壳每回合挡下前两道光。竖着消、点特效，一次打出足够多的光。',
    tint: '只怕同色的光和特效放出的白光，别的颜色会从它身上穿过去。',
    split: '被驱散时散成两缕雾丝，落在左右相邻的两列。',
    mote: '裂雾散开后的残雾。',
    king: '横跨三列，只有正中一列伤得到它，两侧雾袖会吞掉光。每下一步召来一团雾；走到灯前，灯全部熄灭。',
  };

  let current = null;        // level definition in play
  let guideDone = {};
  let tipTimer = 0;
  let queuedTips = [];
  let queuedFoes = [];
  let panelOpen = false;
  let autoMode = 'off';
  let speedNow = 1;

  // ------------------------------------------------------------ screens
  function show(name) {
    for (const id of ['screen-title', 'screen-map', 'screen-game']) $(id).hidden = id !== 'screen-' + name;
    if (name === 'title') titleLoop();
  }

  // ------------------------------------------------------------ title backdrop
  let titleRaf = 0;
  function titleLoop() {
    cancelAnimationFrame(titleRaf);
    const cv = $('title-cv');
    const app = $('app');
    const w = app.clientWidth, h = app.clientHeight;
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    cv.width = w * dpr; cv.height = h * dpr;
    const g = cv.getContext('2d');
    const sky = Art.sky(w, h * 0.78, dpr, true);
    const puffs = Array.from({ length: 5 }, (_, k) => ({ id: k + 2, type: k === 2 ? 'wisp' : k % 2 ? 'mote' : 'wisp', w: 1, x: 0.15 + k * 0.18, y: 0.18 + (k % 3) * 0.1, s: 0.8 + (k % 2) * 0.4 }));
    const t0 = performance.now();
    const tick = (now) => {
      if ($('screen-title').hidden) return;
      const t = (now - t0) / 1000;
      g.setTransform(dpr, 0, 0, dpr, 0, 0);
      g.fillStyle = '#0b1020';
      g.fillRect(0, 0, w, h);
      g.drawImage(sky, 0, 0, w, h * 0.78);
      for (const p of puffs) {
        const x = (p.x * w + t * 6 * p.s) % (w + 80) - 40;
        Art.fog(g, p, x, h * p.y + Math.sin(t * 0.6 + p.id) * 6, w * 0.12 * p.s, t, { alpha: 0.55 });
      }
      const gy = h * 0.36;
      const ground = g.createLinearGradient(0, gy + h * 0.1, 0, h);
      ground.addColorStop(0, 'rgba(11,15,31,0)');
      ground.addColorStop(0.25, '#0b0f1f');
      g.fillStyle = ground;
      g.fillRect(0, gy + h * 0.1, w, h);
      const beam = g.createLinearGradient(0, gy, 0, gy + 12);
      beam.addColorStop(0, '#6b4c38');
      beam.addColorStop(1, '#2d1f18');
      g.fillStyle = beam;
      g.fillRect(w * 0.08, gy, w * 0.84, 12);
      for (let k = 0; k < 3; k++) Art.lantern(g, w * (0.26 + k * 0.24), gy + w * 0.09, w * 0.13, true, t, k + 1);
      titleRaf = requestAnimationFrame(tick);
    };
    titleRaf = requestAnimationFrame(tick);
  }

  // ------------------------------------------------------------ map
  const unlocked = (id) => save.openAll || id === 1 || (save.stars[id - 1] || 0) > 0;
  const endlessOpen = () => save.openAll || (save.stars[5] || 0) > 0;

  function buildMap() {
    const path = $('map-path');
    path.textContent = '';
    for (const L of LEVELS) path.appendChild(node(L));
    path.appendChild(node(null));
    $('map-note').textContent = '';
    const note = $('map-note');
    note.append('通关一关解锁下一关，第 5 关之后开放长夜。');
    const btn = document.createElement('button');
    btn.className = 'btn ghost';
    btn.style.cssText = 'margin-top:10px;padding:7px 14px;font-size:12px;font-weight:400;letter-spacing:0.04em';
    btn.textContent = save.openAll ? '恢复逐关解锁' : '开放全部关卡';
    btn.onclick = () => { save.openAll = !save.openAll; persist(); buildMap(); };
    note.append(document.createElement('br'), btn);
    $('map-sound').style.opacity = save.sound ? 1 : 0.4;
  }

  function node(L) {
    const b = document.createElement('button');
    b.className = 'node';
    const open = L ? unlocked(L.id) : endlessOpen();
    if (!open) b.setAttribute('aria-disabled', 'true');
    const stars = L ? save.stars[L.id] || 0 : 0;
    const icon = Art.lanternIcon(44, L ? stars > 0 : save.best > 0);
    icon.className = 'lamp-icon';
    const mid = document.createElement('div');
    const title = document.createElement('div');
    title.className = 'n-title';
    title.innerHTML = `<span class="n-no">${L ? String(L.id).padStart(2, '0') : '∞'}</span><span class="n-name">${L ? L.name : '长夜'}</span>`;
    const teach = document.createElement('div');
    teach.className = 'n-teach';
    teach.textContent = L ? L.teach : (save.best ? `最远守到第 ${save.best} 波` : '雾不停，灯不灭');
    mid.append(title, teach);
    const side = document.createElement('div');
    side.className = 'n-side';
    const role = document.createElement('span');
    role.className = 'role';
    role.dataset.role = L ? L.role : '无尽';
    role.textContent = L ? L.role : '无尽';
    side.appendChild(role);
    if (L) {
      const st = document.createElement('span');
      st.className = 'stars';
      for (let k = 0; k < 3; k++) { const i = document.createElement('i'); if (k < stars) i.className = 'on'; st.appendChild(i); }
      side.appendChild(st);
    }
    b.append(icon, mid, side);
    b.onclick = () => {
      Sound.resume();
      if (!open) { Sound.nope(); return; }
      Sound.click();
      intro(L || Levels.endless(((Math.random() * 1e6) | 0) + 1));
    };
    return b;
  }

  // ------------------------------------------------------------ cards
  function card(build) {
    const c = $('card');
    c.textContent = '';
    build(c);
    $('veil').hidden = false;
    Game.setPaused(true);
    const btn = c.querySelector('.btn');
    if (btn) btn.focus({ preventScroll: true });
  }
  const closeCard = () => { $('veil').hidden = true; Game.setPaused(false); };

  function el(tag, cls, text) {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }
  function button(text, cls, fn) {
    const b = el('button', cls || 'btn', text);
    b.onclick = () => { Sound.resume(); Sound.click(); fn(); };
    return b;
  }

  function roster(L) {
    const wrap = el('div', 'roster');
    const seen = new Map();
    const k = L.kappa || 1;
    for (const w of L.waves.slice(0, L.key === 'endless' ? 20 : 99)) for (const s of w.spawn) {
      const T = E.ENEMY[s[1]], o = s[2] || {};
      const hp = o.hp != null ? o.hp : Math.max(1, Math.round(T.hp * k * (o.hpMul || 1)));
      const r = seen.get(s[1]) || { n: 0, lo: hp, hi: hp };
      r.n++; r.lo = Math.min(r.lo, hp); r.hi = Math.max(r.hi, hp);
      seen.set(s[1], r);
    }
    for (const [type, r] of seen) {
      const d = el('div');
      d.appendChild(Art.foeIcon(type, 34));
      const sp = el('span');
      sp.append(el('b', null, E.ENEMY[type].name));
      sp.append(el('small', null, L.key === 'endless' ? `血 ${r.lo} 起` : `${r.n} 团 · 血 ${r.lo === r.hi ? r.lo : r.lo + '–' + r.hi}`));
      d.appendChild(sp);
      wrap.appendChild(d);
    }
    return wrap;
  }

  function intro(L) {
    card((c) => {
      const eb = el('div', 'eyebrow');
      eb.append(el('span', null, L.key === 'endless' ? '无尽模式' : `第 ${L.id} 关`));
      const role = el('span', 'role', L.role);
      role.dataset.role = L.role;
      eb.append(role);
      c.append(eb, el('h3', null, L.name), el('p', null, L.teach));
      c.append(roster(L));
      const lamps = el('p', null, `灯墙 ${L.wall} 盏 · 列长 ${L.lane} 格 · ${L.board.colors} 色萤石`);
      lamps.style.fontSize = '12px';
      c.append(lamps);
      const act = el('div', 'actions');
      act.append(button('返回', 'btn ghost', closeCard), button('开始守夜', 'btn', () => { closeCard(); play(L); }));
      c.append(act);
    });
  }

  function foeCard(type, then) {
    card((c) => {
      const row = el('div', 'foe-card');
      row.appendChild(Art.foeIcon(type, 84));
      const txt = el('div');
      const eb = el('div', 'eyebrow', '新的雾');
      txt.append(eb, el('h3', null, E.ENEMY[type].name), el('p', null, FOE_TEXT[type]));
      row.appendChild(txt);
      c.append(row);
      const act = el('div', 'actions');
      act.append(button('知道了', 'btn', () => { closeCard(); then(); }));
      c.append(act);
    });
  }

  function failHint(L) {
    const types = new Set();
    for (const w of L.waves) for (const s of w.spawn) types.add(s[1]);
    if (types.has('king')) return '雾王只在正中一列受伤，把竖光和长明灯留给那一列。';
    if (types.has('shell')) return '岩雾每回合先挡下两道光，竖着消一次射出三道才能伤到它。';
    if (types.has('tint')) return '彩雾只受同色光与白光伤害：找同色萤石，或点按一枚特效。';
    if (types.has('swift')) return '疾雾一回合走一格，先处理离灯最近、走得最快的那团。';
    if (types.has('split')) return '裂雾被驱散时会落到左右两列，应在它离灯墙尚远时打散。';
    return '雾分散时横着消，雾集中在一列时竖着消。';
  }

  function result(st) {
    const L = current;
    const win = st.over === 1;
    const stars = E.stars(st);
    const endless = L.key === 'endless';
    if (endless) {
      if (st.wi > (save.best || 0)) save.best = st.wi;
    } else if (win && stars > (save.stars[L.id] || 0)) save.stars[L.id] = stars;
    persist();
    if (win) Sound.win(); else Sound.lose();
    const shots = st.stats.shots, hit = shots ? Math.round(((shots - st.stats.wasted) / shots) * 100) : 0;
    card((c) => {
      const eb = el('div', 'eyebrow', endless ? '长夜' : `第 ${L.id} 关 · ${L.name}`);
      c.append(eb, el('h3', null, endless ? `守到第 ${st.wi} 波` : win ? (stars === 3 ? '灯火通明' : '守住了') : '灯火熄灭'));
      const lamps = el('div', 'result-lamps');
      for (let k = 0; k < st.wallMax; k++) lamps.appendChild(Art.lanternIcon(58, k < st.wall));
      c.append(lamps);
      if (!win && !endless) c.append(el('p', null, failHint(L)));
      if (endless) c.append(el('p', null, `最远纪录：第 ${save.best} 波。`));
      const grid = el('div', 'result-stats');
      const cell = (v, k) => { const d = el('div'); d.append(el('b', null, v), el('small', null, k)); return d; };
      grid.append(cell(st.turn, '回合'), cell(hit + '%', '命中率'), cell(st.stats.skill, '长明灯'));
      c.append(grid);
      const act = el('div', 'actions');
      act.append(button('地图', 'btn ghost', () => { closeCard(); leaveGame(); }));
      act.append(button(win || endless ? '再来一次' : '重试', 'btn ghost', () => { closeCard(); play(L.key === 'endless' ? Levels.endless(((Math.random() * 1e6) | 0) + 1) : L); }));
      const next = !endless && LEVELS.find((x) => x.id === L.id + 1);
      if (win && next) act.append(button('下一关', 'btn', () => { closeCard(); intro(next); }));
      c.append(act);
    });
  }

  // ------------------------------------------------------------ tips
  function showTip(text, where, sticky) {
    const tip = $('tip');
    tip.textContent = text;
    tip.hidden = false;
    tip.style.top = '6px';
    clearTimeout(tipTimer);
    if (!sticky) tipTimer = setTimeout(() => { tip.hidden = true; }, 4200);
  }
  const hideTip = () => { clearTimeout(tipTimer); $('tip').hidden = true; };

  function once(key, text, where) {
    if (save.seen[key]) return;
    save.seen[key] = 1;
    persist();
    queuedTips.push([text, where]);
  }

  function toast(text) {
    const t = el('div', 'toast', text);
    $('stage').appendChild(t);
    setTimeout(() => t.remove(), 1200);
  }

  // ------------------------------------------------------------ play
  function play(L) {
    current = L;
    guideDone = {};
    queuedTips = [];
    queuedFoes = [];
    show('game');
    hideTip();
    Game.setAuto(false);
    const st = Game.start(L, ((Math.random() * 1e9) | 0) + 1);
    $('hud-no').textContent = L.key === 'endless' ? '无尽模式' : `第 ${L.id} 关 · ${L.role}`;
    $('hud-name').textContent = L.name;
    noteFoes(st.enemies);
    hud();
    afterTurn();
    if (autoMode !== 'off') Game.setAuto(true, autoMode);
    if (panelOpen) renderPanel();
  }

  function leaveGame() {
    Game.stop();
    hideTip();
    closePanel();
    buildMap();
    show('map');
  }

  function hud() {
    const st = Game.state;
    if (!st) return;
    const total = st.waves.length;
    const endless = current && current.key === 'endless';
    $('hud-wave').textContent = endless ? `第 ${st.wi} 波` : `${Math.min(st.wi, total)}/${total}`;
    $('hud-wave-bar').style.width = endless ? Math.min(100, (st.wi / Math.max(15, save.best || 15)) * 100) + '%' : (Math.min(st.wi, total) / total) * 100 + '%';
    $('dock-turn').textContent = st.turn;
    const shots = st.stats.shots;
    $('dock-hit').textContent = shots ? Math.round(((shots - st.stats.wasted) / shots) * 100) + '%' : '—';
    lamp(st.charge);
  }

  function lamp(charge) {
    const st = Game.state;
    const max = (st && st.rules ? st.rules : E.RULES).chargeMax;
    const b = $('lamp-btn');
    b.style.setProperty('--p', Math.min(1, charge / max));
    $('lamp-text').textContent = `${Math.min(charge, max)} / ${max}`;
    const ready = charge >= max;
    if (ready && !b.classList.contains('ready')) { Sound.ready(); once('lamp', '长明灯已充满：点左下角的灯，再点一列', 'board'); }
    b.classList.toggle('ready', ready);
  }

  function noteFoes(list) {
    for (const e of list) {
      const key = 'foe_' + e.type;
      if (save.seen[key]) continue;
      save.seen[key] = 1;
      if (e.type !== 'wisp' && e.type !== 'mote') queuedFoes.push(e.type);
    }
    persist();
  }

  function afterTurn() {
    const st = Game.state;
    if (!st || st.over) return;
    if (queuedFoes.length) {
      const type = queuedFoes.shift();
      const wasAuto = Game.auto;
      if (wasAuto) Game.setAuto(false);
      foeCard(type, () => { if (wasAuto) Game.setAuto(true, autoMode); afterTurn(); });
      return;
    }
    Game.setForced(null);
    const step = !Game.auto && current.guide && current.guide.find((s) => s.turn === st.turn && !guideDone[s.turn]);
    if (step) {
      guideDone[step.turn] = true;
      if (step.drag) {
        const [a, b] = step.drag.map(([x, y]) => y * st.W + x);
        Game.setForced({ kind: 'drag', a, b });
        showTip(step.text, 'board', true);
        return;
      }
      if (step.tap === 'special') {
        let i = -1;
        for (let k = 0; k < st.N; k++) if (st.sp[k]) { i = k; break; }
        if (i >= 0) { Game.setForced({ kind: 'tap', i }); showTip(step.text, 'board', true); return; }
      } else {
        showTip(step.text, step.point === 'board' ? 'board' : 'sky');
        return;
      }
    }
    if (queuedTips.length) {
      const [text, where] = queuedTips.shift();
      showTip(text, where);
      queuedTips = [];
    }
  }

  const hooks = {
    onTurn(ok, log) {
      const st = Game.state;
      hud();
      if (!ok) return;
      let depth = 0;
      for (const ev of log) {
        if (ev.t === 'clear') depth = Math.max(depth, ev.depth);
        if (ev.t === 'spawn') noteFoes(ev.list);
        if (ev.t === 'enemy' && ev.summons) noteFoes(ev.summons);
        if (ev.t === 'enemy' && ev.breaches.length) once('breach', '一团雾走到了灯前，熄灭一盏灯；灯全灭则守夜失败', 'sky');
      }
      if (depth >= 2) once('cascade', '萤石落下又连成一线，这些光也会射向雾', 'board');
      if (!st.over) {
        for (const e of st.enemies) if (e.pos === st.L - 1 && e.timer === 1) { once('danger', '标着红色叹号的雾，这一回合结束就会撞上灯墙', 'sky'); break; }
      }
      if (panelOpen) renderPanel();
      if (!st.over) afterTurn();
      else hideTip();
    },
    onEnd(st) { hideTip(); result(st); },
    onCharge(v) { lamp(v); },
    onCreate(kind) {
      if (kind === E.SP.LINE_H) once('lineH', '横光：点一下，整行的光各射向一列', 'board');
      if (kind === E.SP.LINE_V && current.id !== 3) once('lineV', '竖光：点一下，整列的光射进同一列', 'board');
      if (kind === E.SP.BOMB) once('bomb', '灯爆：点一下，炸开周围九格', 'board');
      if (kind === E.SP.RAINBOW) once('rainbow', '虹石：和任意萤石交换，同色的全部消除', 'board');
    },
    onAim(on) { $('lamp-btn').classList.toggle('aiming', on); if (on) showTip('点一列，长明灯的光会照向那一列的全部雾', 'sky', true); else hideTip(); },
    onBlocked() { const g = current.guide && current.guide.find((s) => s.turn === Game.state.turn); if (g) showTip(g.text, 'board', true); },
    onToast: toast,
    onKill() {},
    onBreach() {},
    onSpawn() {},
    onHintSkill() { $('lamp-btn').classList.add('ready'); },
  };

  // ------------------------------------------------------------ numbers panel
  function pct(v) { return v == null ? '—' : Math.round(v * 100) + '%'; }

  function renderPanel() {
    const body = $('panel-body');
    body.textContent = '';
    const st = Game.state, L = current;
    if (!st || !L) { body.append(el('p', 'note', '进入关卡后显示本关数值。')); return; }
    const R = st.rules || E.RULES;
    const sim = SIM.levels[L.id];

    const s1 = el('section');
    s1.append(el('h4', null, '本关标定'));
    const kv = el('dl', 'kv');
    const add = (k, v) => kv.append(el('dt', null, k), el('dd', null, v));
    if (L.key === 'endless') {
      add('波次间隔', '3 回合，每波一团雾');
      add('血量成长', '每波 +2.5%');
      add('雾王', '每 15 波一只，血量减半');
      if (SIM.endless) add('策略档中位数', `第 ${SIM.endless.strategic[2]} 波`), add('直觉档中位数', `第 ${SIM.endless.naive[2]} 波`);
    } else {
      add('血量系数 κ', (L.kappa || 1).toFixed(2));
      add(L.target == null ? '目标通过率' : `目标通过率（${L.ruler === 'naive' ? '直觉档' : '策略档'}）`, L.target == null ? '教学关，不设目标' : pct(L.target));
      if (sim) add('期望尝试次数（策略档 / 直觉档）', `${(1 / Math.max(0.01, sim.strategic)).toFixed(2)} / ${(1 / Math.max(0.01, sim.naive)).toFixed(2)}`);
    }
    s1.append(kv);
    if (sim) {
      const bars = el('div', 'passbars');
      bars.style.marginTop = '10px';
      for (const [k, name, c] of [['random', '随机', '#6f6a86'], ['naive', '直觉', '#a9a3bd'], ['strategic', '策略', '#ffb44f']]) {
        const row = el('div', 'passbar');
        const bar = el('i');
        bar.style.setProperty('--v', sim[k]);
        bar.style.setProperty('--c', c);
        row.append(el('span', null, name), bar, el('b', null, pct(sim[k])));
        bars.append(row);
      }
      s1.append(bars);
      s1.append(el('p', 'note', `各档机器人各打 ${SIM.n} 局。直觉档只挑消得最多的走法，不看雾；策略档优先打离灯墙最近的雾，并把长明灯投向伤害最大的一列。引入、练习、喘息关按直觉档定目标，其余按策略档。`));
    }
    body.append(s1);

    const s2 = el('section');
    s2.append(el('h4', null, '本关的雾'));
    const tbl = el('table', 'tbl');
    tbl.innerHTML = '<thead><tr><th>雾</th><th>数量</th><th>血量</th><th>回合/格</th><th>护甲</th><th>抵灯回合</th></tr></thead>';
    const tb = el('tbody');
    const rows = new Map();
    for (const w of L.waves.slice(0, L.key === 'endless' ? 15 : 99)) for (const s of w.spawn) {
      const T = E.ENEMY[s[1]], o = s[2] || {};
      const hp = o.hp != null ? o.hp : Math.max(1, Math.round(T.hp * (L.kappa || 1) * (o.hpMul || 1)));
      const r = rows.get(s[1]) || { n: 0, hp: [], speed: o.speed || T.speed };
      r.n++; r.hp.push(hp);
      rows.set(s[1], r);
    }
    for (const [type, r] of rows) {
      const T = E.ENEMY[type];
      const lo = Math.min(...r.hp), hi = Math.max(...r.hp);
      const tr = el('tr');
      tr.innerHTML = `<td>${T.name}</td><td>${r.n}</td><td>${lo === hi ? lo : lo + '–' + hi}</td><td>${r.speed}</td><td>${T.armor || '—'}</td><td>${st.L * r.speed}</td>`;
      tb.append(tr);
    }
    tbl.append(tb);
    s2.append(tbl);
    body.append(s2);

    const s3 = el('section');
    s3.append(el('h4', null, '本局实况'));
    const kv3 = el('dl', 'kv');
    const a3 = (k, v) => kv3.append(el('dt', null, k), el('dd', null, v));
    const S = st.stats, moves = Math.max(1, S.moves);
    a3('回合', st.turn);
    a3('每步消除', (S.cleared / moves).toFixed(1));
    a3('命中 / 射出', `${S.shots - S.wasted} / ${S.shots}`);
    a3('其中连锁射出', pct(S.shots ? S.shotsCascade / S.shots : 0));
    a3('岩壳挡下', S.absorbed);
    a3('特效 生成 / 使用', `${S.created.slice(1).reduce((a, b) => a + b, 0)} / ${S.used.slice(1).reduce((a, b) => a + b, 0)}`);
    a3('长明灯次数', S.skill);
    a3('平均占列', (S.occ / moves).toFixed(1) + ' 列');
    s3.append(kv3);
    body.append(s3);

    const s4 = el('section');
    s4.append(el('h4', null, '规则常数'));
    const kv4 = el('dl', 'kv');
    const a4 = (k, v) => kv4.append(el('dt', null, k), el('dd', null, v));
    a4('灯芯容量', R.chargeMax);
    a4('每道命中充能', '+' + R.chargeHit);
    a4('长明灯伤害', R.skillDmg + '（无视岩壳与颜色）');
    a4('岩雾护甲', E.ENEMY.shell.armor + ' 道 / 回合');
    a4('列长 · 灯墙', `${st.L} 格 · ${st.wallMax} 盏`);
    s4.append(kv4);
    body.append(s4);

    const s5 = el('section');
    s5.append(el('h4', null, '机器人代打'));
    const row = el('div', 'toggle-row');
    const seg = (opts, value, fn) => {
      const wrap = el('div', 'seg');
      for (const [v, label] of opts) {
        const b = el('button', null, label);
        b.setAttribute('aria-pressed', String(v === value));
        b.onclick = () => { fn(v); renderPanel(); };
        wrap.append(b);
      }
      return wrap;
    };
    row.append(seg([['off', '关'], ['naive', '直觉档'], ['strategic', '策略档']], autoMode, (v) => {
      autoMode = v;
      hideTip();
      Game.setAuto(v !== 'off', v === 'off' ? undefined : v);
    }));
    row.append(seg([[1, '1×'], [2, '2×'], [4, '4×']], speedNow, (v) => { speedNow = v; Game.setSpeed(v); }));
    s5.append(row);
    s5.append(el('p', 'note', '代打会跳过新手引导。切回「关」即可继续亲手操作。'));
    body.append(s5);
  }

  function openPanel() { panelOpen = true; $('panel').hidden = false; renderPanel(); }
  function closePanel() { panelOpen = false; $('panel').hidden = true; }

  // ------------------------------------------------------------ wiring
  Game.init($('cv'), $('stage'), hooks);
  $('btn-start').onclick = () => { Sound.resume(); Sound.click(); buildMap(); show('map'); };
  $('btn-endless').onclick = () => {
    Sound.resume(); Sound.click();
    if (!endlessOpen()) { buildMap(); show('map'); return; }
    buildMap(); show('map');
    intro(Levels.endless(((Math.random() * 1e6) | 0) + 1));
  };
  $('map-back').onclick = () => { Sound.click(); show('title'); };
  $('map-sound').onclick = () => { save.sound = !save.sound; Sound.on = save.sound; persist(); buildMap(); Sound.resume(); Sound.click(); };
  $('game-back').onclick = () => { Sound.click(); leaveGame(); };
  $('game-restart').onclick = () => { Sound.click(); if (current) play(current.key === 'endless' ? Levels.endless(((Math.random() * 1e6) | 0) + 1) : current); };
  $('game-numbers').onclick = () => { Sound.click(); panelOpen ? closePanel() : openPanel(); };
  $('panel-close').onclick = closePanel;
  $('lamp-btn').onclick = () => {
    Sound.resume();
    const st = Game.state;
    if (!st) return;
    const max = (st.rules || E.RULES).chargeMax;
    if (st.charge < max) { showTip(`命中的光为长明灯充能，还差 ${max - st.charge} 道`, 'board'); return; }
    Game.toggleAim();
  };
  document.addEventListener('keydown', (e) => {
    if (e.key !== 'Escape') return;
    if (!$('panel').hidden) closePanel();
    else if (Game.aiming) Game.toggleAim();
  });
  window.addEventListener('resize', () => { if (!$('screen-title').hidden) titleLoop(); });

  window.SHOUDENG = { Game, save, play: (id) => play(LEVELS.find((l) => l.id === id)), levels: LEVELS };

  const ready = document.fonts && document.fonts.load ? Promise.all([document.fonts.load('32px "ZCOOL XiaoWei"'), document.fonts.load('700 16px "Noto Sans SC"')]).catch(() => null) : Promise.resolve();
  Promise.race([ready, new Promise((r) => setTimeout(r, 1500))]).then(() => show('title'));
  show('title');
})();
</script>
