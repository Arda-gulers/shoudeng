<meta charset="utf-8">
<title>守灯人</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;700&family=ZCOOL+XiaoWei&display=swap">
<style>
:root {
  --night-0: #090d1b;
  --night-1: #10152a;
  --night-2: #182039;
  --night-3: #232c4b;
  --line: rgba(207, 203, 230, 0.14);
  --paper: #f2e8d2;
  --paper-dim: #a9a3bd;
  --paper-faint: #6f6a86;
  --lamp: #ffb44f;
  --lamp-deep: #e2772b;
  --fog: #cfcbe6;
  --danger: #ff5d4d;
  --calm: #7fd9a4;
  --display: "ZCOOL XiaoWei", "STSong", "Songti SC", "SimSun", serif;
  --ui: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  --app-w: min(100vw, 460px);
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0;
  background: radial-gradient(120% 70% at 50% 0%, #1a2244 0%, var(--night-1) 55%, var(--night-0) 100%) fixed, var(--night-0);
  color: var(--paper);
  font-family: var(--ui);
  font-size: 14px;
  line-height: 1.55;
  overflow: hidden;
  -webkit-tap-highlight-color: transparent;
}
button { font: inherit; color: inherit; }
button:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--lamp); outline-offset: 2px; }

#app {
  position: relative;
  width: var(--app-w);
  height: 100vh;
  height: 100dvh;
  margin: 0 auto;
  overflow: hidden;
  background: var(--night-1);
  box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.04), 0 30px 80px rgba(0, 0, 0, 0.55);
}
.screen { position: absolute; inset: 0; display: flex; flex-direction: column; }

/* ------------------------------------------------------------ buttons */
.btn {
  appearance: none; border: 0; cursor: pointer;
  padding: 11px 22px; border-radius: 999px;
  background: linear-gradient(180deg, #ffc56e, var(--lamp) 55%, var(--lamp-deep));
  color: #2a1606; font-weight: 700; letter-spacing: 0.08em;
  box-shadow: 0 0 24px rgba(255, 180, 79, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.5);
  transition: transform 0.12s ease, box-shadow 0.12s ease;
}
.btn:hover { box-shadow: 0 0 34px rgba(255, 180, 79, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.5); }
.btn:active { transform: translateY(1px) scale(0.98); }
.btn.ghost {
  background: transparent; color: var(--paper);
  box-shadow: inset 0 0 0 1px rgba(242, 232, 210, 0.28);
}
.btn.ghost:hover { box-shadow: inset 0 0 0 1px rgba(255, 180, 79, 0.6); }
.icon-btn {
  appearance: none; border: 0; cursor: pointer; background: transparent;
  width: 38px; height: 38px; border-radius: 12px; display: grid; place-items: center;
  color: var(--paper-dim); font-size: 18px;
}
.icon-btn:hover { color: var(--paper); background: rgba(255, 255, 255, 0.05); }

/* ------------------------------------------------------------ title */
#screen-title { align-items: center; justify-content: flex-end; text-align: center; }
#title-cv { position: absolute; inset: 0; width: 100%; height: 100%; }
.title-block { position: relative; padding: 0 28px 56px; display: flex; flex-direction: column; align-items: center; gap: 18px; }
.title-mark {
  font-family: var(--display); font-size: 76px; line-height: 1; letter-spacing: 0.12em; margin: 0;
  color: #fff3dc; text-shadow: 0 0 28px rgba(255, 180, 79, 0.55), 0 0 2px rgba(255, 220, 160, 0.9);
  writing-mode: horizontal-tb;
}
.title-sub { margin: 0; color: var(--paper-dim); max-width: 22em; text-wrap: balance; }
.title-actions { display: flex; flex-direction: column; gap: 10px; width: min(260px, 80%); margin-top: 8px; }
.title-foot { font-size: 12px; color: var(--paper-faint); letter-spacing: 0.06em; }
.title-foot a { color: var(--paper-dim); margin-left: 10px; text-underline-offset: 3px; }
.title-foot a:hover { color: var(--lamp); }

/* ------------------------------------------------------------ map */
#screen-map { background: linear-gradient(180deg, #0c1122, var(--night-1) 40%, #151b33); }
.map-head { display: flex; align-items: center; gap: 8px; padding: 12px 12px 4px; }
.map-head h2 { font-family: var(--display); font-weight: 400; font-size: 26px; margin: 0; letter-spacing: 0.06em; flex: 1; }
.map-head small { color: var(--paper-dim); font-size: 12px; }
.map-scroll { flex: 1; overflow-y: auto; padding: 8px 18px 28px; scrollbar-width: thin; }
.map-path { position: relative; display: flex; flex-direction: column; gap: 10px; }
.node {
  position: relative; display: grid; grid-template-columns: 44px 1fr auto; align-items: center; gap: 12px;
  padding: 10px 14px 10px 10px; border-radius: 16px; cursor: pointer;
  background: rgba(24, 32, 57, 0.72); box-shadow: inset 0 0 0 1px var(--line);
  text-align: left; border: 0; width: 86%;
}
.node:nth-child(4n + 2), .node:nth-child(4n + 3) { margin-left: auto; }
.node:hover { box-shadow: inset 0 0 0 1px rgba(255, 180, 79, 0.5); }
.node[aria-disabled="true"] { cursor: not-allowed; opacity: 0.45; }
.node .lamp-icon { width: 44px; height: 44px; }
.node .n-title { display: flex; align-items: baseline; gap: 8px; }
.node .n-no { color: var(--paper-faint); font-size: 12px; font-variant-numeric: tabular-nums; }
.node .n-name { font-family: var(--display); font-size: 21px; letter-spacing: 0.04em; }
.node .n-teach { color: var(--paper-dim); font-size: 12px; }
.node .n-side { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
.role { font-size: 11px; padding: 1px 8px; border-radius: 999px; letter-spacing: 0.08em; white-space: nowrap; background: rgba(255, 255, 255, 0.06); color: var(--paper-dim); }
.role[data-role="卡点"], .role[data-role="首领"] { background: rgba(255, 93, 77, 0.16); color: #ffab9f; }
.role[data-role="喘息"] { background: rgba(127, 217, 164, 0.14); color: #a8ecc2; }
.role[data-role="引入"], .role[data-role="练习"], .role[data-role="进阶"], .role[data-role="小考"] { background: rgba(255, 180, 79, 0.13); color: #ffd39a; }
.stars { display: flex; gap: 3px; }
.stars i { width: 9px; height: 9px; border-radius: 50%; background: #2d3558; display: block; }
.stars i.on { background: var(--lamp); box-shadow: 0 0 8px rgba(255, 180, 79, 0.8); }
.map-note { margin: 18px 4px 0; color: var(--paper-faint); font-size: 12px; }

/* ------------------------------------------------------------ game */
.hud { display: grid; grid-template-columns: 38px 1fr auto 38px; align-items: center; gap: 6px; padding: 8px 8px 2px; }
.hud-title { display: flex; flex-direction: column; line-height: 1.15; min-width: 0; }
.hud-title .lv-no { color: var(--paper-faint); font-size: 11px; letter-spacing: 0.1em; }
.hud-title .lv-name { font-family: var(--display); font-size: 22px; letter-spacing: 0.05em; white-space: nowrap; }
.hud-wave { display: flex; flex-direction: column; align-items: flex-end; gap: 3px; font-size: 11px; color: var(--paper-dim); }
.hud-wave b { color: var(--paper); font-size: 13px; font-variant-numeric: tabular-nums; }
.wave-bar { width: 92px; height: 4px; border-radius: 4px; background: #262f50; overflow: hidden; }
.wave-bar i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, #8e86b8, var(--fog)); transition: width 0.3s; }
.stage { position: relative; flex: 1; min-height: 0; display: flex; justify-content: center; align-items: flex-start; }
#cv { display: block; touch-action: none; }
.dock { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 12px; padding: 6px 14px 12px; }
.lamp-btn {
  --p: 0; position: relative; appearance: none; border: 0; cursor: pointer; background: transparent;
  display: flex; align-items: center; gap: 10px; padding: 4px 12px 4px 4px; border-radius: 999px;
  box-shadow: inset 0 0 0 1px var(--line);
}
.lamp-ring {
  width: 46px; height: 46px; border-radius: 50%; display: grid; place-items: center;
  background: conic-gradient(var(--lamp) calc(var(--p) * 360deg), #262f50 0);
}
.lamp-ring::before {
  content: ""; width: 36px; height: 36px; border-radius: 50%;
  background: radial-gradient(circle at 50% 60%, rgba(255, 190, 90, calc(0.15 + var(--p) * 0.85)) 0 30%, #141a30 70%);
  box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.06);
}
.lamp-btn .lamp-label { display: flex; flex-direction: column; line-height: 1.15; text-align: left; }
.lamp-btn .lamp-label b { font-family: var(--display); font-weight: 400; font-size: 17px; letter-spacing: 0.06em; }
.lamp-btn .lamp-label small { color: var(--paper-dim); font-size: 11px; font-variant-numeric: tabular-nums; }
.lamp-btn.ready { box-shadow: inset 0 0 0 1px rgba(255, 180, 79, 0.75), 0 0 24px rgba(255, 180, 79, 0.35); animation: glow 1.4s ease-in-out infinite; }
.lamp-btn.aiming { box-shadow: inset 0 0 0 2px var(--lamp), 0 0 30px rgba(255, 180, 79, 0.55); }
@keyframes glow { 50% { box-shadow: inset 0 0 0 1px rgba(255, 180, 79, 1), 0 0 36px rgba(255, 180, 79, 0.55); } }
.dock-info { display: flex; justify-content: center; gap: 14px; color: var(--paper-dim); font-size: 12px; }
.dock-info b { color: var(--paper); font-variant-numeric: tabular-nums; font-weight: 700; }

.tip {
  position: absolute; left: 50%; transform: translateX(-50%);
  max-width: 88%; padding: 9px 16px; border-radius: 14px; pointer-events: none;
  background: rgba(12, 16, 32, 0.9); box-shadow: inset 0 0 0 1px rgba(255, 180, 79, 0.45), 0 10px 30px rgba(0, 0, 0, 0.4);
  font-size: 14px; text-align: center; text-wrap: balance; z-index: 5;
}
.toast {
  position: absolute; left: 50%; top: 38%; transform: translate(-50%, -50%);
  font-family: var(--display); font-size: 30px; letter-spacing: 0.1em; color: #fff0d0; pointer-events: none;
  text-shadow: 0 0 20px rgba(255, 180, 79, 0.8); z-index: 6; white-space: nowrap;
  animation: toast 1.1s ease forwards;
}
@keyframes toast { 0% { opacity: 0; transform: translate(-50%, -30%) scale(0.9); } 20% { opacity: 1; transform: translate(-50%, -50%) scale(1); } 80% { opacity: 1; } 100% { opacity: 0; transform: translate(-50%, -70%); } }

/* ------------------------------------------------------------ overlays */
.veil {
  position: absolute; inset: 0; z-index: 20; display: grid; place-items: center; padding: 18px;
  background: rgba(6, 9, 20, 0.62); backdrop-filter: blur(3px);
}
.card {
  width: 100%; max-width: 380px; border-radius: 22px; padding: 22px 22px 18px;
  background: linear-gradient(180deg, #1c2442, #141a31); box-shadow: inset 0 0 0 1px rgba(242, 232, 210, 0.12), 0 24px 60px rgba(0, 0, 0, 0.5);
  display: flex; flex-direction: column; gap: 14px;
}
.card h3 { font-family: var(--display); font-weight: 400; font-size: 30px; margin: 0; letter-spacing: 0.06em; line-height: 1.1; }
.card .eyebrow { display: flex; align-items: center; gap: 8px; color: var(--paper-faint); font-size: 12px; letter-spacing: 0.08em; }
.card p { margin: 0; color: var(--paper-dim); text-wrap: pretty; }
.card .actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 4px; }
.roster { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 8px; }
.roster div { display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-radius: 12px; background: rgba(255, 255, 255, 0.04); }
.roster canvas { width: 34px; height: 34px; flex: none; }
.roster span { display: flex; flex-direction: column; line-height: 1.2; font-size: 12px; }
.roster span b { font-weight: 700; font-size: 13px; }
.roster span small { color: var(--paper-dim); font-variant-numeric: tabular-nums; }
.foe-card { display: grid; grid-template-columns: 84px 1fr; gap: 14px; align-items: center; }
.foe-card canvas { width: 84px; height: 84px; }
.result-lamps { display: flex; justify-content: center; gap: 16px; padding: 4px 0; }
.result-lamps canvas { width: 58px; height: 74px; }
.result-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; text-align: center; }
.result-stats div { padding: 8px 4px; border-radius: 12px; background: rgba(255, 255, 255, 0.04); }
.result-stats b { display: block; font-size: 18px; font-variant-numeric: tabular-nums; }
.result-stats small { color: var(--paper-dim); font-size: 11px; }

/* ------------------------------------------------------------ numbers panel */
.panel {
  position: absolute; inset: 0 0 0 auto; width: min(100%, 400px); z-index: 30;
  background: rgba(12, 16, 31, 0.97); box-shadow: -20px 0 50px rgba(0, 0, 0, 0.5);
  display: flex; flex-direction: column;
}
.panel-head { display: flex; align-items: center; padding: 12px 10px 6px 18px; }
.panel-head h3 { flex: 1; margin: 0; font-family: var(--display); font-weight: 400; font-size: 24px; letter-spacing: 0.06em; }
.panel-body { flex: 1; overflow-y: auto; padding: 4px 18px 24px; display: flex; flex-direction: column; gap: 18px; }
.panel section h4 { margin: 0 0 8px; font-size: 12px; font-weight: 700; letter-spacing: 0.12em; color: var(--lamp); }
.kv { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; font-size: 13px; }
.kv dt { color: var(--paper-dim); }
.kv dd { margin: 0; text-align: right; font-variant-numeric: tabular-nums; }
.tbl { width: 100%; border-collapse: collapse; font-size: 12px; font-variant-numeric: tabular-nums; }
.tbl th { text-align: right; color: var(--paper-faint); font-weight: 400; padding: 4px 6px; border-bottom: 1px solid var(--line); }
.tbl td { text-align: right; padding: 5px 6px; border-bottom: 1px solid rgba(207, 203, 230, 0.06); }
.tbl th:first-child, .tbl td:first-child { text-align: left; }
.passbars { display: flex; flex-direction: column; gap: 6px; }
.passbar { display: grid; grid-template-columns: 58px 1fr 44px; align-items: center; gap: 8px; font-size: 12px; }
.passbar i { height: 8px; border-radius: 6px; background: #232b49; position: relative; overflow: hidden; }
.passbar i::after { content: ""; position: absolute; inset: 0 auto 0 0; width: calc(var(--v) * 100%); background: var(--c, var(--fog)); border-radius: 6px; }
.passbar b { text-align: right; font-variant-numeric: tabular-nums; }
.toggle-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.seg { display: inline-flex; border-radius: 999px; box-shadow: inset 0 0 0 1px var(--line); overflow: hidden; }
.seg button { appearance: none; border: 0; background: transparent; padding: 6px 12px; cursor: pointer; color: var(--paper-dim); font-size: 12px; }
.seg button[aria-pressed="true"] { background: rgba(255, 180, 79, 0.18); color: var(--paper); }
.note { color: var(--paper-faint); font-size: 12px; }

@media (prefers-reduced-motion: reduce) {
  .lamp-btn.ready { animation: none; }
  .toast { animation-duration: 0.01s; }
}
</style>

<div id="app">
  <section class="screen" id="screen-title">
    <canvas id="title-cv"></canvas>
    <div class="title-block">
      <h1 class="title-mark">守灯人</h1>
      <p class="title-sub">山雾入夜便下山。你守着村口的三盏灯，把萤石连成一线，光沿着那一列射向雾。</p>
      <div class="title-actions">
        <button class="btn" id="btn-start">开始守夜</button>
        <button class="btn ghost" id="btn-endless">长夜 · 无尽模式</button>
      </div>
      <div class="title-foot">第一章「雾起」· 十二关<!-- @doc-link --></div>
    </div>
  </section>

  <section class="screen" id="screen-map" hidden>
    <div class="map-head">
      <button class="icon-btn" id="map-back" aria-label="返回标题">‹</button>
      <h2>第一章 · 雾起</h2>
      <button class="icon-btn" id="map-sound" aria-label="声音开关">♪</button>
    </div>
    <div class="map-scroll">
      <div class="map-path" id="map-path"></div>
      <p class="map-note" id="map-note"></p>
    </div>
  </section>

  <section class="screen" id="screen-game" hidden>
    <header class="hud">
      <button class="icon-btn" id="game-back" aria-label="返回地图">‹</button>
      <div class="hud-title"><span class="lv-no" id="hud-no">第 1 关</span><span class="lv-name" id="hud-name">点灯</span></div>
      <div class="hud-wave"><span>波次 <b id="hud-wave">1/3</b></span><span class="wave-bar"><i id="hud-wave-bar"></i></span></div>
      <button class="icon-btn" id="game-numbers" aria-label="数值面板" title="数值面板">∑</button>
    </header>
    <div class="stage" id="stage">
      <canvas id="cv"></canvas>
      <div class="tip" id="tip" hidden></div>
    </div>
    <footer class="dock">
      <button class="lamp-btn" id="lamp-btn" aria-label="长明灯">
        <span class="lamp-ring"></span>
        <span class="lamp-label"><b>长明灯</b><small id="lamp-text">0 / 40</small></span>
      </button>
      <div class="dock-info"><span>回合 <b id="dock-turn">1</b></span><span>命中 <b id="dock-hit">—</b></span></div>
      <button class="icon-btn" id="game-restart" aria-label="重新开始本关" title="重新开始">↻</button>
    </footer>
  </section>

  <div class="veil" id="veil" hidden><div class="card" id="card" role="dialog" aria-modal="true"></div></div>

  <aside class="panel" id="panel" hidden>
    <div class="panel-head"><h3>数值面板</h3><button class="icon-btn" id="panel-close" aria-label="关闭">✕</button></div>
    <div class="panel-body" id="panel-body"></div>
  </aside>
</div>

<script>
/* Generated by tools/calibrate.js (1000 seeds per probe). Level id -> hp scale. */
(function (root) {
  const CALIB = {"4":0.97,"5":1.17,"6":0.77,"7":1.12,"8":1.17,"9":0.87,"10":0.77,"11":1.08,"12":1.11};
  if (typeof module === 'object' && module.exports) module.exports = CALIB;
  else root.CALIB = CALIB;

<script>
/* 守灯人 rules engine. Pure state and logic, no DOM: the page and the Node simulator load this same file. */
(function (root, factory) {
  const api = factory();
  if (typeof module === 'object' && module.exports) module.exports = api;
  else root.Engine = api;
})(typeof self !== 'undefined' ? self : globalThis, function () {
  'use strict';

  const SP = { NONE: 0, LINE_H: 1, LINE_V: 2, BOMB: 3, RAINBOW: 4 };
  const EMPTY = -1;
  const MAXC = 6;   // colours 0..5 can match
  const RB = 7;     // colour slot of a rainbow tile, never matches
  const UNK = 8;    // spawn placeholder while a bot looks ahead, never matches
  const WHITE = 9;  // shot colour of light released by a special

  // hp is the base value before the level's hp scale; speed = turns per step; armor = shots absorbed per turn
  const ENEMY = {
    wisp:  { name: '雾团', hp: 20,  speed: 2, armor: 0, atk: 1, w: 1 },
    swift: { name: '疾雾', hp: 12,  speed: 1, armor: 0, atk: 1, w: 1 },
    shell: { name: '岩雾', hp: 20,  speed: 3, armor: 2, atk: 1, w: 1 },
    tint:  { name: '彩雾', hp: 12,  speed: 2, armor: 0, atk: 1, w: 1, tint: true },
    split: { name: '裂雾', hp: 16,  speed: 2, armor: 0, atk: 1, w: 1, split: 'mote' },
    mote:  { name: '雾丝', hp: 6,   speed: 2, armor: 0, atk: 1, w: 1 },
    king:  { name: '雾王', hp: 90,  speed: 4, armor: 0, atk: 3, w: 3, core: 1, summon: 'wisp' },
  };

  const RULES = {
    chargeMax: 40,     // 长明灯 meter
    chargeHit: 1,      // per shot that lands on a fog (damage or armour)
    chargeWaste: 0,    // per shot that finds no fog
    chargeKill: 0,     // per kill
    chargeCascade: 1,  // per ordinary tile cleared by a cascade when cascade === 'charge'
    cascade: 'fire',   // 'fire': cascades shoot like direct matches; 'charge': they fill the lamp instead
    skillDmg: 15,      // to every fog in the chosen lane, ignores armour and tint
    summonHp: 10,      // wisp called by 雾王 each time it steps (before hp scale)
    splitHp: 6,        // each 雾丝 left by a 裂雾 (before hp scale)
  };

  const MAXN = 400;
  const S_H = new Int16Array(MAXN), S_V = new Int16Array(MAXN);
  const S_CLR = new Uint8Array(MAXN), S_DONE = new Uint8Array(MAXN);

  function rnd(st) {
    let t = (st.rs = (st.rs + 0x6D2B79F5) | 0);
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  }
  function rint(st, n) { return Math.floor(rnd(st) * n); }

  function newStats() {
    return {
      moves: 0, steps: 0, maxDepth: 0, cleared: 0, shots: 0, wasted: 0, absorbed: 0, blocked: 0,
      dmg: 0, kills: 0, breaches: 0, skill: 0, shuffles: 0, focus: 0, banked: 0, shotsCascade: 0, occ: 0,
      created: [0, 0, 0, 0, 0], used: [0, 0, 0, 0, 0],
    };
  }

  // ---------------------------------------------------------------- setup

  function create(level, seed, opt) {
    opt = opt || {};
    const b = level.board || {};
    const W = b.w || 7, H = b.h || 8, N = W * H;
    const st = {
      W, H, N, C: b.colors || 5, L: level.lane || 6,
      mask: new Uint8Array(N), top: new Int8Array(W), bot: new Int8Array(W),
      col: new Int8Array(N).fill(EMPTY), sp: new Uint8Array(N), id: new Int32Array(N),
      nid: 1, rs: seed | 0, look: false,
      kappa: opt.kappa != null ? opt.kappa : (level.kappa || 1),
      enemies: [], eid: 1, waves: level.waves || [], wi: 0, shift: 0, pending: [],
      turn: 1, wall: level.wall || 3, wallMax: level.wall || 3,
      charge: 0, over: 0, log: null, flip: 0,
      rules: opt.rules ? Object.assign({}, RULES, opt.rules) : null,
      acc: new Int16Array(W),
      stats: newStats(),
    };
    for (let x = 0; x < W; x++) {
      const seg = b.cols ? b.cols[x] : [0, H - 1];
      st.top[x] = seg[0]; st.bot[x] = seg[1];
      for (let y = seg[0]; y <= seg[1]; y++) st.mask[y * W + x] = 1;
    }
    if (b.layout) loadLayout(st, b.layout); else fillRandom(st, null);
    if (opt.log) st.log = [];
    spawnWaves(st);
    return st;
  }

  function loadLayout(st, rows) {
    const fixed = new Uint8Array(st.N);
    for (let y = 0; y < st.H; y++) for (let x = 0; x < st.W; x++) {
      const i = y * st.W + x, ch = rows[y][x];
      if (!st.mask[i]) continue;
      if (ch >= '0' && ch <= '5') { st.col[i] = +ch; st.id[i] = st.nid++; fixed[i] = 1; }
    }
    fillRandom(st, fixed);
  }

  function fillRandom(st, fixed) {
    for (let tries = 0; tries < 200; tries++) {
      for (let i = 0; i < st.N; i++) if (st.mask[i] && !(fixed && fixed[i])) st.col[i] = EMPTY;
      for (let y = 0; y < st.H; y++) for (let x = 0; x < st.W; x++) {
        const i = y * st.W + x;
        if (!st.mask[i] || (fixed && fixed[i])) continue;
        st.col[i] = pickSafe(st, x, y); st.sp[i] = 0; st.id[i] = st.nid++;
      }
      if (!findGroups(st) && hasMove(st)) return;
    }
  }

  function pickSafe(st, x, y) {
    const { W, H, col, C } = st;
    const at = (xx, yy) => (xx < 0 || yy < 0 || xx >= W || yy >= H) ? -9 : col[yy * W + xx];
    for (let k = 0; k < 30; k++) {
      const c = rint(st, C);
      if (at(x - 1, y) === c && (at(x - 2, y) === c || at(x + 1, y) === c)) continue;
      if (at(x + 1, y) === c && at(x + 2, y) === c) continue;
      if (at(x, y - 1) === c && (at(x, y - 2) === c || at(x, y + 1) === c)) continue;
      if (at(x, y + 1) === c && at(x, y + 2) === c) continue;
      return c;
    }
    return rint(st, C);
  }

  // ---------------------------------------------------------------- matching

  function findGroups(st) {
    const { W, H, N, col } = st;
    S_H.fill(-1, 0, N); S_V.fill(-1, 0, N);
    const runs = [];
    for (let y = 0; y < H; y++) {
      let x = 0;
      while (x < W) {
        const c = col[y * W + x];
        if (c < 0 || c >= MAXC) { x++; continue; }
        let e = x + 1;
        while (e < W && col[y * W + e] === c) e++;
        if (e - x >= 3) {
          const cells = [];
          for (let k = x; k < e; k++) { cells.push(y * W + k); S_H[y * W + k] = runs.length; }
          runs.push({ dir: 0, c, cells });
        }
        x = e;
      }
    }
    for (let x = 0; x < W; x++) {
      let y = 0;
      while (y < H) {
        const c = col[y * W + x];
        if (c < 0 || c >= MAXC) { y++; continue; }
        let e = y + 1;
        while (e < H && col[e * W + x] === c) e++;
        if (e - y >= 3) {
          const cells = [];
          for (let k = y; k < e; k++) { cells.push(k * W + x); S_V[k * W + x] = runs.length; }
          runs.push({ dir: 1, c, cells });
        }
        y = e;
      }
    }
    if (!runs.length) return null;
    const par = runs.map((_, k) => k);
    const find = (k) => { while (par[k] !== k) k = par[k] = par[par[k]]; return k; };
    for (const r of runs) {
      if (r.dir !== 1) continue;
      for (const i of r.cells) if (S_H[i] >= 0) {
        const a = find(S_H[i]), b = find(S_V[i]);
        if (a !== b) par[a] = b;
      }
    }
    const map = new Map();
    for (let k = 0; k < runs.length; k++) {
      const root = find(k);
      let g = map.get(root);
      if (!g) map.set(root, g = { c: runs[k].c, runs: [] });
      g.runs.push(runs[k]);
    }
    return [...map.values()];
  }

  function groupKind(g) {
    let maxLen = 0, dirOfMax = 0, hasH = false, hasV = false;
    for (const r of g.runs) {
      const n = r.cells.length;
      if (n > maxLen) { maxLen = n; dirOfMax = r.dir; }
      if (r.dir === 0) hasH = true; else hasV = true;
    }
    if (maxLen >= 5) return SP.RAINBOW;
    if (hasH && hasV) return SP.BOMB;
    if (maxLen === 4) return dirOfMax === 0 ? SP.LINE_H : SP.LINE_V;
    return SP.NONE;
  }

  function groupCells(g) {
    const out = [];
    for (const r of g.runs) for (const i of r.cells) if (out.indexOf(i) < 0) out.push(i);
    return out;
  }

  function pickCell(st, g, cells, kind, pivots) {
    if (pivots) for (const p of pivots) if (cells.indexOf(p) >= 0) return p;
    if (kind === SP.BOMB) {
      for (const i of cells) if (S_H[i] >= 0 && S_V[i] >= 0) return i;
    }
    let best = g.runs[0];
    for (const r of g.runs) if (r.cells.length > best.cells.length) best = r;
    return best.cells[(best.cells.length / 2) | 0];
  }

  function lineAt(st, i) {
    const { W, H, col } = st;
    const c = col[i];
    if (c < 0 || c >= MAXC) return false;
    const x = i % W, y = (i / W) | 0;
    let n = 1;
    for (let k = x - 1; k >= 0 && col[y * W + k] === c; k--) n++;
    for (let k = x + 1; k < W && col[y * W + k] === c; k++) n++;
    if (n >= 3) return true;
    n = 1;
    for (let k = y - 1; k >= 0 && col[k * W + x] === c; k--) n++;
    for (let k = y + 1; k < H && col[k * W + x] === c; k++) n++;
    return n >= 3;
  }

  function swapMatches(st, a, b) {
    const col = st.col, ca = col[a], cb = col[b];
    if (ca === cb) return false;
    col[a] = cb; col[b] = ca;
    const r = lineAt(st, a) || lineAt(st, b);
    col[a] = ca; col[b] = cb;
    return r;
  }

  function validSwap(st, a, b) {
    const { col, sp } = st;
    if (col[a] === EMPTY || col[b] === EMPTY) return false;
    if (col[a] === RB || col[b] === RB) return true;
    if (sp[a] && sp[b]) return true;
    return swapMatches(st, a, b);
  }

  function hasMove(st) {
    const { N, W, col, sp } = st;
    for (let i = 0; i < N; i++) if (col[i] !== EMPTY && sp[i]) return true;
    for (let i = 0; i < N; i++) {
      if (col[i] === EMPTY) continue;
      if (i % W + 1 < W && validSwap(st, i, i + 1)) return true;
      if (i + W < N && validSwap(st, i, i + W)) return true;
    }
    return false;
  }

  // Every legal action: [a, b] swaps a tile into neighbour b, [a, -1] taps a special.
  function listMoves(st) {
    const out = [];
    const { N, W, col, sp } = st;
    for (let i = 0; i < N; i++) {
      if (col[i] === EMPTY) continue;
      if (sp[i]) out.push([i, -1]);
      if (i % W + 1 < W && validSwap(st, i, i + 1)) out.push([i, i + 1]);
      if (i + W < N && validSwap(st, i, i + W)) out.push([i, i + W]);
    }
    return out;
  }

  function adjacent(st, a, b) {
    const W = st.W, ax = a % W, bx = b % W;
    return (Math.abs(a - b) === 1 && ((a / W) | 0) === ((b / W) | 0)) || (a - b === W || b - a === W) && ax === bx;
  }

  function swapCells(st, a, b) {
    const { col, sp, id } = st;
    let t = col[a]; col[a] = col[b]; col[b] = t;
    t = sp[a]; sp[a] = sp[b]; sp[b] = t;
    t = id[a]; id[a] = id[b]; id[b] = t;
  }

  // ---------------------------------------------------------------- clearing

  function area(st, i, kind, out) {
    const { W, H, col } = st;
    const x = i % W, y = (i / W) | 0;
    const push = (xx, yy) => {
      if (xx < 0 || yy < 0 || xx >= W || yy >= H) return;
      const j = yy * W + xx;
      if (col[j] !== EMPTY) out.push(j);
    };
    if (kind === SP.LINE_H) for (let k = 0; k < W; k++) push(k, y);
    else if (kind === SP.LINE_V) for (let k = 0; k < H; k++) push(x, k);
    else if (kind === SP.BOMB) for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) push(x + dx, y + dy);
  }

  function commonColor(st) {
    const cnt = [0, 0, 0, 0, 0, 0];
    for (let i = 0; i < st.N; i++) { const c = st.col[i]; if (c >= 0 && c < MAXC) cnt[c]++; }
    let best = 0;
    for (let c = 1; c < MAXC; c++) if (cnt[c] > cnt[best]) best = c;
    return best;
  }

  // The swap already happened: the dragged tile sits on c, its partner on p.
  function comboPre(st, c, p) {
    const { W, H, N, col, sp } = st;
    const pre = { marks: [], done: [c, p], queue: [], acts: [], convert: null };
    const x = c % W, y = (c / W) | 0;
    if (col[c] === RB && col[p] === RB) {
      for (let i = 0; i < N; i++) if (col[i] !== EMPTY) pre.marks.push(i);
      pre.acts.push({ i: c, kind: 'RB2', c: -1, cells: pre.marks.slice() });
      return pre;
    }
    if (col[c] === RB || col[p] === RB) {
      const rb = col[c] === RB ? c : p, other = rb === c ? p : c;
      const color = col[other], okind = sp[other];
      if (!okind) {
        for (let i = 0; i < N; i++) if (col[i] === color) pre.marks.push(i);
        pre.done = [rb];
        pre.acts.push({ i: rb, kind: 'RB', c: color, cells: pre.marks.slice() });
        return pre;
      }
      const conv = [];
      for (let i = 0; i < N; i++) {
        if (col[i] !== color || sp[i] || i === other) continue;
        sp[i] = okind === SP.BOMB ? SP.BOMB : (((i % W) + ((i / W) | 0)) % 2 ? SP.LINE_H : SP.LINE_V);
        conv.push(i);
      }
      pre.convert = conv.map((i) => [i, sp[i], st.id[i]]);
      pre.done = [rb];
      pre.marks = [rb];
      pre.queue = conv.concat([other]);
      pre.acts.push({ i: rb, kind: 'RBX', c: color, cells: conv.slice() });
      return pre;
    }
    const kc = sp[c], kp = sp[p];
    const isLine = (k) => k === SP.LINE_H || k === SP.LINE_V;
    const cells = [];
    const add = (xx, yy) => {
      if (xx < 0 || yy < 0 || xx >= W || yy >= H) return;
      const j = yy * W + xx;
      if (col[j] !== EMPTY && cells.indexOf(j) < 0) cells.push(j);
    };
    let kind;
    if (isLine(kc) && isLine(kp)) {
      kind = 'CROSS';
      for (let k = 0; k < W; k++) add(k, y);
      for (let k = 0; k < H; k++) add(x, k);
    } else if (isLine(kc) || isLine(kp)) {
      kind = 'CROSS3';
      for (let d = -1; d <= 1; d++) {
        for (let k = 0; k < W; k++) add(k, y + d);
        for (let k = 0; k < H; k++) add(x + d, k);
      }
    } else {
      kind = 'BOMB5';
      for (let dy = -2; dy <= 2; dy++) for (let dx = -2; dx <= 2; dx++) add(x + dx, y + dy);
    }
    pre.marks = cells;
    pre.acts.push({ i: c, kind, c: -1, cells: cells.slice() });
    return pre;
  }

  function runClear(st, groups, pivots, pre, depth) {
    const { N, W, col, sp, id } = st;
    const L = st.log;
    const clr = S_CLR, done = S_DONE;
    clr.fill(0, 0, N); done.fill(0, 0, N);
    const creates = [], acts = [], queue = [];
    if (groups) {
      for (const g of groups) {
        const cells = groupCells(g);
        for (const i of cells) clr[i] = 1;
        const k = groupKind(g);
        if (k) {
          const at = pickCell(st, g, cells, k, pivots);
          creates.push({ i: at, kind: k, c: k === SP.RAINBOW ? RB : g.c });
        }
      }
      for (let i = 0; i < N; i++) if (clr[i] && sp[i]) queue.push(i);
    }
    if (pre) {
      for (const a of pre.acts) acts.push(a);
      for (const i of pre.done) { done[i] = 1; clr[i] = 2; st.stats.used[sp[i]]++; }
      for (const i of pre.marks) {
        if (col[i] === EMPTY) continue;
        if (!clr[i] && sp[i] && !done[i]) queue.push(i);
        clr[i] = 2;
      }
      for (const i of pre.queue) { clr[i] = 2; queue.push(i); }
    }
    while (queue.length) {
      const i = queue.pop();
      if (done[i]) continue;
      done[i] = 1; clr[i] = 2;
      const kind = sp[i];
      if (!kind) continue;
      st.stats.used[kind]++;
      const cells = [];
      let c = -1;
      if (kind === SP.RAINBOW) {
        c = commonColor(st);
        for (let j = 0; j < N; j++) if (col[j] === c) cells.push(j);
      } else area(st, i, kind, cells);
      acts.push({ i, kind, c, cells });
      for (const j of cells) {
        if (clr[j] === 2) continue;
        const was = clr[j];
        clr[j] = 2;
        if (sp[j] && !done[j] && !was) queue.push(j);
      }
    }

    const shots = st.shotBuf || (st.shotBuf = new Int16Array(W * 10));
    shots.fill(0);
    const ev = L ? { t: 'clear', depth, cells: [], ids: [], cols: [], kinds: [], causes: [], acts, creates: [], convert: pre ? pre.convert : null } : null;
    let cleared = 0, banked = 0;
    const rules = st.rules || RULES;
    const bank = depth > 1 && rules.cascade === 'charge';
    for (let i = 0; i < N; i++) {
      if (!clr[i] || col[i] === EMPTY) continue;
      let isCreate = false;
      for (const cr of creates) if (cr.i === i) { isCreate = true; break; }
      if (isCreate) continue;
      if (bank && clr[i] === 1) banked++;
      else {
        shots[(i % W) * 10 + (clr[i] === 2 ? 9 : col[i])]++;
        st.acc[i % W]++;
        if (depth > 1) st.stats.shotsCascade++;
      }
      cleared++;
      if (ev) { ev.cells.push(i); ev.ids.push(id[i]); ev.cols.push(col[i]); ev.kinds.push(sp[i]); ev.causes.push(clr[i]); }
      col[i] = EMPTY; sp[i] = 0;
    }
    for (const cr of creates) {
      col[cr.i] = cr.c; sp[cr.i] = cr.kind;
      st.stats.created[cr.kind]++;
      if (ev) ev.creates.push({ i: cr.i, id: id[cr.i], kind: cr.kind, c: cr.c });
    }
    st.stats.cleared += cleared;
    st.stats.banked += banked;
    if (banked && !st.look) st.charge = Math.min(rules.chargeMax, st.charge + banked * rules.chargeCascade);
    if (ev) { ev.banked = banked; L.push(ev); }
    fire(st, shots, depth);
  }

  // ---------------------------------------------------------------- lanes

  function front(st, x, c) {
    let best = null;
    for (const e of st.enemies) {
      if (x < e.lane || x >= e.lane + e.w) continue;
      if (e.tint >= 0 && c !== WHITE && c !== e.tint) continue;
      if (!best || e.pos > best.pos) best = e;
    }
    return best;
  }

  function fire(st, shots, depth) {
    const L = st.log;
    const lanes = L ? [] : null;
    const born = [];
    for (let x = 0; x < st.W; x++) {
      let total = 0;
      for (let k = 0; k < 10; k++) total += shots[x * 10 + k];
      if (!total) continue;
      const hits = L ? [] : null;
      let wasted = 0;
      wasted += hitLane(st, x, WHITE, shots[x * 10 + 9], hits, born);
      for (let c = 0; c < MAXC; c++) wasted += hitLane(st, x, c, shots[x * 10 + c], hits, born);
      st.stats.shots += total;
      st.stats.wasted += wasted;
      const R = st.rules || RULES;
      if (!st.look) st.charge = Math.min(R.chargeMax, st.charge + wasted * R.chargeWaste + (total - wasted) * R.chargeHit);
      if (L) {
        let white = shots[x * 10 + 9];
        const byColor = [];
        for (let c = 0; c < MAXC; c++) byColor.push(shots[x * 10 + c]);
        lanes.push({ lane: x, n: total, white, byColor, wasted, hits });
      }
    }
    if (L && lanes.length) L.push({ t: 'shots', depth, lanes, charge: st.charge });
    if (born.length && L) L.push({ t: 'spawn', list: born.map(snap), why: 'split' });
  }

  function hitLane(st, x, c, n, hits, born) {
    while (n > 0) {
      const e = front(st, x, c);
      if (!e) {
        if (c !== WHITE) for (const f of st.enemies) if (x >= f.lane && x < f.lane + f.w) { st.stats.blocked += n; break; }
        return n;
      }
      if (e.core >= 0 && x !== e.lane + e.core) {
        st.stats.blocked += n;
        if (hits) hits.push({ e: e.id, arm: n, hp: e.hp, c });
        return n;
      }
      if (e.armorLeft > 0) {
        const a = Math.min(e.armorLeft, n);
        e.armorLeft -= a; n -= a; st.stats.absorbed += a;
        if (hits) hits.push({ e: e.id, a, hp: e.hp, c });
        continue;
      }
      const d = Math.min(e.hp, n);
      e.hp -= d; n -= d; st.stats.dmg += d;
      const dead = e.hp <= 0;
      if (hits) hits.push({ e: e.id, d, hp: e.hp, c, k: dead ? 1 : 0 });
      if (dead) kill(st, e, born);
    }
    return 0;
  }

  function kill(st, e, born) {
    const k = st.enemies.indexOf(e);
    if (k < 0) return;
    st.enemies.splice(k, 1);
    st.stats.kills++;
    if (!st.look) st.charge = Math.min((st.rules || RULES).chargeMax, st.charge + (st.rules || RULES).chargeKill);
    const T = ENEMY[e.type];
    if (T.split) {
      for (const x of [e.lane - 1, e.lane + 1]) {
        const child = spawnEnemy(st, T.split, Math.max(0, Math.min(st.W - 1, x)), e.pos, { hp: Math.max(1, Math.round((st.rules || RULES).splitHp * st.kappa)) });
        if (child) born.push(child);
      }
    }
  }

  function occupied(st, lane, w, pos, self) {
    for (const e of st.enemies) {
      if (e === self || e.pos !== pos) continue;
      if (lane < e.lane + e.w && e.lane < lane + w) return true;
    }
    return false;
  }

  function spawnEnemy(st, type, lane, pos, o) {
    const T = ENEMY[type];
    const w = T.w || 1;
    lane = Math.max(0, Math.min(st.W - w, lane));
    let at = -1;
    for (let p = pos; p >= 0; p--) if (!occupied(st, lane, w, p, null)) { at = p; break; }
    if (at < 0) return null;
    const hp = o.hp != null ? o.hp : Math.max(1, Math.round(T.hp * st.kappa * (o.hpMul || 1)));
    const speed = o.speed || T.speed;
    const e = {
      id: st.eid++, type, lane, w, pos: at, hp, maxHp: hp, speed, timer: speed,
      armor: T.armor, armorLeft: T.armor, atk: T.atk, tint: T.tint ? (o.c | 0) : -1,
      core: o.core != null ? o.core : T.core != null ? T.core : -1,
    };
    st.enemies.push(e);
    return e;
  }

  function snap(e) {
    return { id: e.id, type: e.type, lane: e.lane, w: e.w, pos: e.pos, hp: e.hp, maxHp: e.maxHp, speed: e.speed, timer: e.timer, armor: e.armor, tint: e.tint, atk: e.atk, core: e.core };
  }

  function spawnWaves(st) {
    if (!st.enemies.length && !st.pending.length && st.wi < st.waves.length) {
      const wt = st.waves[st.wi].t - st.shift;
      if (wt > st.turn) st.shift += wt - st.turn;
    }
    while (st.wi < st.waves.length && st.waves[st.wi].t - st.shift <= st.turn) {
      for (const s of st.waves[st.wi].spawn) st.pending.push(s);
      st.wi++;
    }
    if (!st.pending.length) return;
    const keep = [], list = [];
    for (const s of st.pending) {
      const o = s[2] || {};
      const e = spawnEnemy(st, s[1], s[0], o.pos || 0, o);
      if (e) list.push(e); else keep.push(s);
    }
    st.pending = keep;
    if (st.log && list.length) st.log.push({ t: 'spawn', list: list.map(snap), why: 'wave' });
  }

  function nextWave(st) {
    if (st.wi >= st.waves.length) return null;
    const w = st.waves[st.wi];
    return { turn: Math.max(st.turn + 1, w.t - st.shift), lanes: w.spawn.map((s) => s[0]), index: st.wi };
  }

  function enemyPhase(st) {
    const L = st.log;
    const moved = [], breaches = [], summons = [];
    const order = st.enemies.slice().sort((p, q) => q.pos - p.pos);
    for (const e of order) {
      if (st.enemies.indexOf(e) < 0) continue;
      e.armorLeft = e.armor;
      e.timer--;
      if (e.timer > 0) continue;
      const np = e.pos + 1;
      if (np >= st.L) {
        st.enemies.splice(st.enemies.indexOf(e), 1);
        st.wall = Math.max(0, st.wall - e.atk);
        st.stats.breaches++;
        breaches.push({ e: e.id, lane: e.lane, w: e.w, atk: e.atk, wall: st.wall });
        if (st.wall <= 0) { st.over = -1; break; }
        continue;
      }
